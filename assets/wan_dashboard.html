<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vantablack — v{{VERSION}}</title>
  <style>
    :root {
      --coal-top: #232428;
      --coal-mid: #141518;
      --coal-deep: #0C0D0F;
      --ivory: #F4F1EA;
      --ivory-card: #EAE6DC;
      --ivory-muted: rgba(244, 241, 234, 0.58);
      --ivory-faint: rgba(244, 241, 234, 0.42);
      --hairline: rgba(255, 255, 255, 0.10);
      --surface-row: rgba(255, 255, 255, 0.045);
      --visor-glint: #DCFF02;
      --emerald: #34D399;
      --amber: #FBBF24;
      --rose: #FB7185;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--coal-deep);
      color: var(--ivory);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .app-shell {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(90% 80% at 50% 36%, var(--coal-top) 0%, var(--coal-mid) 58%, var(--coal-deep) 100%);
    }

    /* ── Frameless Titlebar ── */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 24px;
      z-index: 20;
    }

    .brand-group { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-size: 14px; font-weight: 500; letter-spacing: -0.01em; color: var(--ivory); cursor: pointer; }
    .brand-version { font-size: 11px; color: var(--ivory-faint); font-variant-numeric: tabular-nums; }

    .update-pill {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--ivory);
      color: var(--coal-deep);
      font-size: 11px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .update-pill:hover { transform: scale(1.03); }

    .win-controls { display: flex; align-items: center; gap: 6px; }
    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--ivory-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .win-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--ivory); }
    .win-btn.close:hover { background: rgba(239, 68, 68, 0.22); color: #FCA5A5; }

    /* ── Center Stage ── */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 26px;
      overflow-y: auto;
    }

    .hero-grid {
      width: 100%;
      max-width: 740px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
    }
    @media (max-width: 620px) {
      .hero-grid { grid-template-columns: 1fr; gap: 16px; text-align: center; }
      .flank-card { text-align: center !important; align-items: center !important; }
      .mode-pills { justify-content: center !important; }
    }
    .flank-card {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background-color 0.16s ease;
    }
    .flank-card:hover {
      background: rgba(255, 255, 255, 0.065);
      border-color: rgba(244, 241, 234, 0.24);
      transform: translateY(-1px);
    }
    .flank-card.left { text-align: left; align-items: flex-start; }
    .flank-card.right { text-align: right; align-items: flex-end; }
    .flank-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ivory-faint);
    }
    .flank-value { font-size: 20px; font-weight: 500; color: var(--ivory); margin-top: 2px; }
    .flank-sub { font-size: 11.5px; color: var(--ivory-muted); margin-top: 2px; }
    .mode-pills {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .mini-pill {
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.04);
      color: var(--ivory-muted);
      font-size: 10.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .mini-pill:hover { color: var(--ivory); border-color: rgba(255, 255, 255, 0.24); }
    .mini-pill.active { background: var(--ivory); color: var(--coal-deep); border-color: var(--ivory); font-weight: 600; }

    /* ── Machined Brushed-Steel Center Button ── */
    .center-btn-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
    .center-btn-steel {
      width: 164px;
      height: 164px;
      border-radius: 999px;
      padding: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #46474C 0%, #707278 48%, #B9BAC0 100%);
      box-shadow:
        0 26px 52px -12px rgba(0, 0, 0, 0.72),
        0 6px 16px rgba(0, 0, 0, 0.42),
        inset 0 1px 1px rgba(255, 255, 255, 0.62),
        inset 0 -2px 4px rgba(0, 0, 0, 0.45);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .center-btn-steel:hover { transform: scale(1.028); }
    .center-btn-steel:active { transform: scale(0.965); }

    .center-btn-core {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 32%, #2B2D32 0%, #191A1D 75%, #121316 100%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.14), 0 3px 10px rgba(0, 0, 0, 0.55);
    }

    .center-led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.2);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .center-led.on { background: var(--ivory); box-shadow: 0 0 12px var(--ivory); }
    .center-status-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--ivory); }

    @keyframes pulseRing {
      0% { opacity: 0.52; transform: scale(0.88); }
      100% { opacity: 0; transform: scale(1.38); }
    }
    .ring-pulse {
      position: absolute;
      width: 196px;
      height: 196px;
      border-radius: 50%;
      border: 1px solid rgba(244, 241, 234, 0.28);
      pointer-events: none;
      animation: pulseRing 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* ── Sheet Cards ── */
    .coal-sheet {
      width: 100%;
      max-width: 760px;
      max-height: calc(100vh - 156px);
      display: flex;
      flex-direction: column;
      background: rgba(20, 21, 24, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55);
    }

    .sheet-body {
      overflow-y: auto;
      padding-right: 4px;
    }
    .sheet-body::-webkit-scrollbar { width: 5px; }
    .sheet-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 99px; }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 11px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .sheet-title { font-size: 14px; font-weight: 600; color: var(--ivory); }
    .sheet-close {
      background: none;
      border: none;
      color: var(--ivory-muted);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .sheet-close:hover { color: var(--ivory); background: rgba(255, 255, 255, 0.06); }

    .pill-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .pill-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: rgba(244, 241, 234, 0.68);
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .pill-btn:hover { color: var(--ivory); }
    .pill-btn.active { background: var(--ivory); color: var(--coal-deep); }

    .qr-card-spring {
      display: inline-block;
      padding: 14px;
      background: var(--ivory-card);
      border-radius: 24px;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.55);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .qr-card-spring:hover { transform: scale(1.035) rotate(-0.8deg); }
    .qr-card-spring svg { width: 232px; height: 232px; display: block; }

    .coal-row {
      background: var(--surface-row);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .coal-card {
      background: var(--surface-row);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 13px 15px;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (max-width: 600px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    .input-pill-row { display: flex; gap: 8px; align-items: center; }
    .input-pill, .select-pill {
      flex: 1;
      padding: 8px 13px;
      font-size: 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--ivory);
      outline: none;
      font-family: inherit;
    }
    .select-pill { flex: 0 0 auto; cursor: pointer; }
    .select-pill option { background: #141518; color: #F4F1EA; }
    .input-pill:focus, .select-pill:focus { border-color: rgba(244, 241, 234, 0.45); }

    .action-pill {
      padding: 8px 15px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 999px;
      border: none;
      background: var(--ivory);
      color: var(--coal-deep);
      cursor: pointer;
    }
    .action-pill:hover { opacity: 0.92; }

    .subtle-pill {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.09);
      color: var(--ivory);
      cursor: pointer;
    }
    .subtle-pill:hover { background: rgba(255, 255, 255, 0.16); }

    .danger-pill {
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 999px;
      border: 1px solid rgba(251, 113, 133, 0.35);
      background: rgba(251, 113, 133, 0.12);
      color: var(--rose);
      cursor: pointer;
    }

    .tag-pill {
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      color: var(--ivory-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tag-pill.ok { background: rgba(52, 211, 153, 0.15); color: var(--emerald); }
    .tag-pill.warn { background: rgba(251, 191, 36, 0.15); color: var(--amber); }

    .setting-card { text-align: left; cursor: pointer; color: var(--ivory); font-family: inherit; transition: border-color 0.15s ease, background-color 0.15s ease; }
    .setting-card:hover { border-color: rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.065); }
    .setting-title { font-size: 12px; font-weight: 500; color: var(--ivory); }
    .setting-sub { font-size: 11px; color: var(--ivory-muted); margin-top: 2px; }
    .mono { font-family: var(--mono); user-select: text; }

    .ivory-switch {
      width: 38px;
      height: 22px;
      border-radius: 999px;
      padding: 3px;
      display: inline-flex;
      align-items: center;
      transition: background-color 0.15s ease;
      flex-shrink: 0;
    }
    .ivory-knob {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mesh-svg-box {
      width: 100%;
      height: 250px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
    }

    .kv-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 11.5px;
      padding: 3px 0;
    }
    .kv-k { color: var(--ivory-muted); }
    .kv-v { color: var(--ivory); font-family: var(--mono); text-align: right; word-break: break-all; }

    /* ── Bottom Pill Dock ── */
    .bottom-dock {
      padding: 14px 24px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 20;
    }
    .dock-cluster {
      padding: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Toast & PIN Modal ── */
    .toast-pill {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 16px;
      border-radius: 999px;
      background: var(--ivory);
      color: var(--coal-deep);
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      z-index: 50;
      pointer-events: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
    }
    .modal-backdrop.open { display: flex; }
  </style>
</head>
<body>
  <div class="app-shell" id="tab-mesh" data-multicast="239.255.0.1:2270">
    <!-- Frameless Titlebar -->
    <div class="titlebar" id="drag-handle">
      <div class="brand-group">
        <span class="brand-title" id="brand-home">Vantablack</span>
        <span class="brand-version" id="app-version">v{{VERSION}}</span>
        <button type="button" class="update-pill" id="titlebar-update-pill">⚡ Update Available</button>
      </div>
      <div class="win-controls titlebar-controls">
        <button type="button" class="win-btn" onclick="nativeSend('minimize')" title="Minimize">—</button>
        <button type="button" class="win-btn" onclick="nativeSend('maximize')" title="Maximize">□</button>
        <button type="button" class="win-btn close" onclick="nativeSend('close')" title="Close">✕</button>
      </div>
    </div>

    <!-- Center Stage -->
    <div class="stage" id="stage-root"></div>

    <!-- Bottom Pill Dock -->
    <div class="bottom-dock" id="dock-root"></div>

    <!-- Toast Notification -->
    <div class="toast-pill" id="toast-pill" style="display:none;"></div>
  </div>

  <!-- Optional Console PIN Modal -->
  <div class="modal-backdrop" id="pin-modal" role="dialog" aria-modal="true">
    <div class="coal-sheet" style="max-width: 380px;">
      <div class="sheet-header">
        <span class="sheet-title">Unlock Vantablack</span>
        <button type="button" class="sheet-close" onclick="dismissPinModal()">✕</button>
      </div>
      <form onsubmit="submitPinModal(event)">
        <div class="input-pill-row" style="margin-bottom: 10px;">
          <input type="password" id="pin-modal-input" class="input-pill" placeholder="Enter console PIN" autocomplete="off" />
          <button type="submit" class="action-pill">Unlock</button>
        </div>
        <div id="pin-modal-error" style="display:none; font-size:11px; color:#FCA5A5;"></div>
      </form>
    </div>
  </div>

  <script>
    const PIN_KEY = 'ggn-console-pin';
    let pinModalDismissed = false;

    const STATE = {
      version: '{{VERSION}}',
      connected: false,
      mode: 'Stealth',
      cityId: 'zurich',
      sheet: null,             // null | 'qr' | 'devices' | 'settings'
      qrTab: 'phone',          // 'phone' | 'voucher'
      devicesTab: 'list',      // 'list' | 'map'
      settingsTab: 'general',  // 'general' | 'routing' | 'continuum' | 'diagnostics'
      meshFilter: 'all',       // 'all' | 'lan' | 'wan' | 'exit'
      showHopOverlay: false,
      inspectedFp: null,
      pulse: false,

      // Live node & invite data
      status: {},
      topology: null,
      settings: {},
      anchors: null,
      pairUri: '',
      qrSvg: '',
      mintedVoucherHex: '',
      voucherMinting: false,

      // Speed tracking
      prevSent: null,
      prevRecv: null,
      prevTs: null,
      downSpeed: 0,
      upSpeed: 0,

      // Benchmark, Continuum v2, X-Ray
      benchmarkRunning: false,
      benchmarkResult: null,
      continuum: { homeExit: null, btcr: null, ladder: null, racs: null, error: null },
      xray: null,

      // Software updates
      updateChecking: false,
      updateApplying: false,
      updateInfo: null,

      peers: []
    };

    function nativeSend(action) {
      if (window.ipc && window.ipc.postMessage) window.ipc.postMessage(action);
    }

    const dragBar = document.getElementById('drag-handle');
    if (dragBar) {
      dragBar.addEventListener('mousedown', (e) => {
        if (e.target.closest('.win-btn') || e.target.closest('.titlebar-controls') || e.target.closest('button')) return;
        nativeSend('drag');
      });
    }

    document.getElementById('brand-home').addEventListener('click', () => {
      STATE.sheet = null;
      STATE.inspectedFp = null;
      render();
    });

    document.getElementById('titlebar-update-pill').addEventListener('click', () => triggerUpdateAction());

    function storedPin() { return sessionStorage.getItem(PIN_KEY); }
    function pinHeaders(extra) {
      const headers = Object.assign({}, extra || {});
      const pin = storedPin();
      if (pin) headers['X-Pin'] = pin;
      return headers;
    }

    let toastTimer = null;
    function notify(msg) {
      const el = document.getElementById('toast-pill');
      if (!el) return;
      el.textContent = msg;
      el.style.display = 'block';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2500);
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.min(sizes.length - 1, Math.floor(Math.log(bytes) / Math.log(k)));
      return (bytes / Math.pow(k, i)).toFixed(i === 0 ? 0 : 1) + ' ' + sizes[i];
    }

    function formatDuration(secs) {
      if (!secs) return '00:00:00';
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = Math.floor(secs % 60);
      return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }

    function copyText(text, label) {
      if (!text) { notify('Nothing to copy yet'); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => notify((label || 'Copied') + ' to clipboard'))
          .catch(() => notify('Clipboard blocked'));
      }
    }

    function curExitDisplay() {
      const pinned = STATE.continuum.homeExit && STATE.continuum.homeExit.selected;
      if (pinned) {
        const peer = STATE.peers.find(p => p.fingerprint === pinned);
        return {
          id: pinned,
          title: (peer && peer.name) || pinned.slice(0, 12),
          sub: (peer && peer.address) ? ('Pinned Exit · ' + peer.address) : 'Pinned Home Exit'
        };
      }
      const onlineCount = STATE.peers.filter(p => p.connected).length;
      return {
        id: 'auto',
        title: 'Auto Mesh',
        sub: onlineCount > 0 ? `${onlineCount} peer${onlineCount === 1 ? '' : 's'} online` : 'Adaptive Routing'
      };
    }

    function dockExitOptions() {
      const opts = [{ id: 'auto', label: 'Auto Mesh' }];
      const candidates = (STATE.continuum.homeExit && Array.isArray(STATE.continuum.homeExit.candidates))
        ? STATE.continuum.homeExit.candidates
        : [];
      const seen = new Set();
      candidates.forEach(c => {
        if (!c.fingerprint || seen.has(c.fingerprint)) return;
        seen.add(c.fingerprint);
        const peer = STATE.peers.find(p => p.fingerprint === c.fingerprint);
        opts.push({ id: c.fingerprint, label: (peer && peer.name) || c.fingerprint.slice(0, 8) });
      });
      STATE.peers.forEach(p => {
        if (!p.fingerprint || seen.has(p.fingerprint)) return;
        if (p.is_exit || String(p.role || '').toLowerCase().includes('exit')) {
          seen.add(p.fingerprint);
          opts.push({ id: p.fingerprint, label: p.name || p.fingerprint.slice(0, 8) });
        }
      });
      return opts.slice(0, 4);
    }

    function modeToBackend(uiMode) {
      if (uiMode === 'Fast') return 'public';
      if (uiMode === 'Multi-Hop') return 'paranoid';
      return 'stealth';

      if (m === 'public' || m === 'fast' || m === 'direct') return 'Fast';

    // ── Connected Liquid Tracks QR + Stealth Visor Ghost ──
    function hashSeedFromText(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619) >>> 0;
      }
      return h || 23;
    }

    function buildLiquidQrGrid(seed) {
      const N = 25;
      const grid = Array.from({ length: N }, () => Array(N).fill(false));
      const inFinder = (r, c) => (r < 8 && c < 8) || (r < 8 && c >= N - 8) || (r >= N - 8 && c < 8);
      const inCenter = (r, c) => r >= 8 && r <= 16 && c >= 8 && c <= 16;
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (inFinder(r, c) || inCenter(r, c)) continue;
          const isTiming = (r === 6 || c === 6) && ((r + c) % 2 === 0);
          const h = ((r * 31 + c * 17 + (seed & 0xffff)) * 2654435761) >>> 0;
          grid[r][c] = isTiming || ((h % 11) < 6);
        }
      }
      return grid;
    }

    function renderStealthVisorGhostEmblem() {
      return `
        <g transform="translate(8.15, 8.15)">
          <rect x="0" y="0" width="8.7" height="8.7" rx="2.5" fill="#0C0D0F" stroke="#EAE6DC" stroke-width="0.45" />
          <path d="M2.1 4.3 C2.1 1.8, 6.6 1.8, 6.6 4.3 L6.7 6.6 C6.2 6.1, 5.7 6.65, 5.15 6.65 C4.65 6.65, 4.35 6.15, 4.35 6.15 C4.35 6.15, 4.05 6.65, 3.55 6.65 C3.0 6.65, 2.5 6.1, 2.0 6.6 Z" fill="#F4F1EA" />
          <rect x="2.65" y="3.45" width="3.4" height="1.25" rx="0.62" fill="#0C0D0F" />
          <line x1="3.1" y1="3.85" x2="4.15" y2="3.85" stroke="#DCFF02" stroke-width="0.32" stroke-linecap="round" />
          <circle cx="5.25" cy="3.85" r="0.18" fill="#DCFF02" />

      `;
    }

    function renderConnectedLiquidTracksQr() {
      if (STATE.qrSvg && STATE.qrSvg.startsWith('<svg')) {
        return `<div class="qr-card-spring">${STATE.qrSvg}</div>`;
      }
      const N = 25;
      const grid = buildLiquidQrGrid(hashSeedFromText(STATE.pairUri || 'vb-net://pair'));
      let bars = '';
      for (let r = 0; r < N; r++) {
        let c = 0;
        while (c < N) {
          if (!grid[r][c]) { c++; continue; }
          let end = c;
          while (end + 1 < N && grid[r][end + 1]) end++;
          const w = (end - c + 1) - 0.16;
          bars += `<rect x="${c + 0.08}" y="${r + 0.12}" width="${w}" height="0.76" rx="0.38" fill="#0C0D0F" />`;
          c = end + 1;
        }
      }
      const eye = (x, y) => `
        <g transform="translate(${x},${y})">
          <circle cx="3.5" cy="3.5" r="3.08" fill="none" stroke="#0C0D0F" stroke-width="0.95" />
          <circle cx="3.5" cy="3.5" r="1.52" fill="#0C0D0F" />
        </g>`;
      return `
        <div class="qr-card-spring">
          <svg viewBox="-1 -1 27 27" role="img" aria-label="Vantablack Connected Liquid Tracks QR">
            ${eye(0, 0)} ${eye(N - 7, 0)} ${eye(0, N - 7)}
            ${bars}
            ${renderStealthVisorGhostEmblem()}
          </svg>
        </div>
      `;
    }

    // ── Interactive Monolith Coal Mesh SVG Map ──
    function renderMeshTopologySvg() {
      const peers = filteredPeers();
      const cx = 340, cy = 125, r = 88;
      const selfLabel = (STATE.topology && STATE.topology.self && STATE.topology.self.name) || 'This Device';
      let edges = '';
      let nodes = '';

      peers.forEach((p, idx) => {
        const angle = (idx / Math.max(1, peers.length)) * Math.PI * 2 - Math.PI / 2;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        const isSelected = STATE.inspectedFp === p.fingerprint;
        const stroke = p.connected ? 'rgba(244,241,234,0.45)' : 'rgba(244,241,234,0.16)';
        const dash = p.scope === 'lan' ? '' : 'stroke-dasharray="4 3"';
        edges += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${stroke}" stroke-width="${isSelected ? 2 : 1.2}" ${dash} />`;
        if (STATE.showHopOverlay && p.latency_ms != null) {
          const mx = (cx + x) / 2, my = (cy + y) / 2;
          edges += `<text x="${mx.toFixed(1)}" y="${(my - 4).toFixed(1)}" fill="rgba(244,241,234,0.65)" font-size="9" text-anchor="middle">${p.latency_ms}ms</text>`;
        }
        const label = (p.name || p.address || p.fingerprint || 'Peer').slice(0, 14);
        nodes += `
          <g style="cursor:pointer;" data-inspect-fp="${escapeHtml(p.fingerprint)}">
            <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isSelected ? 12 : 9}" fill="${p.connected ? '#F4F1EA' : '#32343A'}" stroke="${isSelected ? '#DCFF02' : '#0C0D0F'}" stroke-width="2" />
            <text x="${x.toFixed(1)}" y="${(y + 22).toFixed(1)}" fill="#F4F1EA" font-size="10" text-anchor="middle">${escapeHtml(label)}</text>
          </g>
        `;
      });

      return `
        <div class="mesh-svg-box">
          <svg viewBox="0 0 680 250" width="100%" height="100%">
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 5" />
            ${edges}
            <circle cx="${cx}" cy="${cy}" r="15" fill="#F4F1EA" stroke="rgba(244,241,234,0.35)" stroke-width="5" />
            <text x="${cx}" y="${cy + 30}" fill="#F4F1EA" font-size="11" font-weight="600" text-anchor="middle">${escapeHtml(selfLabel)}</text>
            ${nodes}
            ${peers.length === 0 ? `<text x="${cx}" y="${cy + 58}" fill="rgba(244,241,234,0.45)" font-size="11" text-anchor="middle">No peers matching current filter</text>` : ''}
          </svg>
        </div>
      `;
    }

      return STATE.peers.filter(p => {
        if (STATE.meshFilter === 'lan') return p.scope === 'lan';
        if (STATE.meshFilter === 'wan') return p.scope !== 'lan';
        if (STATE.meshFilter === 'exit') return Boolean(p.is_exit) || String(p.role || '').toLowerCase().includes('exit');
        return true;

                    <div class="setting-sub">Floods traffic across nearby peers if routing breaks (high data use)</div>
                  </div>
                  ${toggleSwitchHtml(Boolean(st.exp_diffusion))}
                </button>
              </div>
            </div>
          </details>
        `;
      } else if (tab === 'routing') {
        const basePort = STATE.status.socks_port || 1080;
        const listening = Boolean(STATE.status.socks_listening);
        const pacUrl = `${window.location.origin}/proxy.pac`;
        const bypass = Array.isArray(st.bypass) ? st.bypass : [];
        bodyHtml = `
          <div style="display:flex; flex-direction:column; gap:10px;">
            <div class="coal-card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span class="setting-title">Multi-Port SOCKS5 &amp; PAC Proxy</span>
                <span class="tag-pill ${listening ? 'ok' : ''}">${listening ? `LISTENING :${basePort}–:${basePort + 3}` : 'OFF'}</span>
              </div>
              <div class="kv-line"><span class="kv-k">Primary SOCKS5</span><span class="kv-v">127.0.0.1:${basePort}</span></div>
              <div class="kv-line"><span class="kv-k">Auto-Config PAC URL</span><span class="kv-v">${escapeHtml(pacUrl)}</span></div>
              <div style="margin-top:8px; display:flex; justify-content:flex-end;">
                <button type="button" class="subtle-pill" data-act="copy-pac">Copy PAC URL</button>
              </div>
            </div>

            <div class="coal-card">
              <div class="setting-title" style="margin-bottom:8px;">Split-Tunnel Bypass Rules (${bypass.length})</div>
              <div class="input-pill-row" style="margin-bottom:10px;">
                <input id="bypass-inp" class="input-pill" placeholder="Domain or CIDR to bypass (e.g. local.lan, 192.168.0.0/16)" />
                <button type="button" class="action-pill" data-act="add-bypass">Add Rule</button>
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:6px;">
                ${bypass.length > 0 ? bypass.map(rule => `
                  <span class="coal-row" style="padding:5px 10px; border-radius:999px; gap:8px;">
                    <span class="mono" style="font-size:11px;">${escapeHtml(rule)}</span>
                    <button type="button" class="sheet-close" style="padding:0 3px;" data-del-bypass="${escapeHtml(rule)}">✕</button>
                  </span>
                `).join('') : `<span style="font-size:11px; color:var(--ivory-muted);">No custom bypass rules configured.</span>`}
              </div>
            </div>
          </div>
        `;
      } else if (tab === 'continuum') {
        const he = STATE.continuum.homeExit || {};
        const xr = STATE.xray || {};
        const btcr = STATE.continuum.btcr || {};
        const racs = STATE.continuum.racs || {};
        bodyHtml = `
          <div style="display:flex; flex-direction:column; gap:10px;">
            <div class="coal-card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span class="setting-title">Home Exit &amp; Boomerang Circuit</span>
                <div style="display:flex; gap:6px;">
                  ${he.selected ? `<button type="button" class="subtle-pill" data-act="clear-home-exit">Clear Pin</button>` : ''}
                  <button type="button" class="subtle-pill" data-act="refresh-v2">Refresh</button>
                </div>
              </div>
              <div class="kv-line"><span class="kv-k">Selected Exit</span><span class="kv-v">${escapeHtml(he.selected || 'Adaptive (Auto)')}</span></div>
              <div class="kv-line"><span class="kv-k">Planned Circuit</span><span class="kv-v">${escapeHtml((he.planned_circuit && (he.planned_circuit.state + (he.planned_circuit.hops ? ' (' + he.planned_circuit.hops + ' hops)' : ''))) || '—')}</span></div>
              <div class="kv-line"><span class="kv-k">BTCR Balance</span><span class="kv-v">${escapeHtml(btcr.balance != null ? String(btcr.balance) : (btcr.state || '—'))}</span></div>
              <div class="kv-line"><span class="kv-k">RACS Congestion</span><span class="kv-v">${escapeHtml((racs.cc && racs.cc.cwnd != null) ? ('cwnd ' + racs.cc.cwnd) : (racs.state || '—'))}</span></div>
            </div>

            <div class="coal-card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span class="setting-title">Adversary Goggles (X-Ray Truth Ledger)</span>
                <span class="tag-pill">${escapeHtml(xr.regime || 'live')}</span>
              </div>
              <div style="font-size:12px; font-weight:500; margin-bottom:6px; color:${(xr.invariants || []).some(i => i.state === 'failed') ? 'var(--amber)' : 'var(--emerald)'};">
                ${escapeHtml(xr.headline || 'Loading truth ledger...')}
              </div>
              <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:8px;">
                ${(xr.invariants || []).map(i => `
                  <div class="kv-line">
                    <span class="kv-k"><strong style="color:${i.state === 'verified' ? 'var(--emerald)' : i.state === 'failed' ? 'var(--rose)' : 'var(--ivory-muted)'};">${escapeHtml(i.state)}</strong> · ${escapeHtml(i.id)}</span>
                    <span class="kv-v">${escapeHtml(i.detail || '')}</span>
                  </div>
                `).join('')}
              </div>
              ${(xr.observations || []).length ? `
                <div class="grid-2">
                  ${xr.observations.map(o => `
                    <div class="coal-card" style="padding:9px 11px;">
                      <div class="setting-title" style="margin-bottom:4px;">${escapeHtml(o.observer)}</div>
                      <div style="font-size:10.5px; color:var(--ivory-muted);">Sees: ${escapeHtml((o.sees || []).join(', ') || 'none')}</div>
                      <div style="font-size:10.5px; color:var(--ivory-faint); margin-top:2px;">Hidden: ${escapeHtml((o.does_not_see || []).join(', ') || 'none')}</div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      } else {
        const tp = STATE.status.throughput || STATE.status.traffic || {};
        const bench = STATE.benchmarkResult;
        bodyHtml = `
          <div style="display:flex; flex-direction:column; gap:10px;">
            <div class="grid-3">
              <div class="coal-card">
                <div class="flank-label">Downlink</div>
                <div style="font-size:16px; font-weight:600; margin-top:4px;">${formatBytes(STATE.downSpeed)}/s</div>
                <div class="setting-sub">${formatBytes(tp.bytes_recv || 0)} total</div>
              </div>
              <div class="coal-card">
                <div class="flank-label">Uplink</div>
                <div style="font-size:16px; font-weight:600; margin-top:4px;">${formatBytes(STATE.upSpeed)}/s</div>
                <div class="setting-sub">${formatBytes(tp.bytes_sent || 0)} total</div>
              </div>
              <div class="coal-card">
                <div class="flank-label">Sessions &amp; Uptime</div>
                <div style="font-size:16px; font-weight:600; margin-top:4px;">${STATE.status.active_sessions || 0} active</div>
                <div class="setting-sub">${formatDuration(STATE.status.uptime_secs || 0)}</div>
              </div>
            </div>

            <div class="coal-card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <div>
                  <div class="setting-title">Crypto &amp; Reed-Solomon RS(2,1) Benchmark</div>
                  <div class="setting-sub">In-process XChaCha20-Poly1305 + erasure coding probe</div>
                </div>
                <button type="button" class="action-pill" data-act="run-bench">${STATE.benchmarkRunning ? 'Running...' : 'Run Benchmark'}</button>
              </div>
              ${bench ? `
                <div class="grid-3">
                  <div class="kv-line"><span class="kv-k">Throughput</span><span class="kv-v">${Number(bench.throughput_mbps || 0).toFixed(1)} Mbps</span></div>
                  <div class="kv-line"><span class="kv-k">p50 / p99</span><span class="kv-v">${(bench.latency_us && bench.latency_us.p50) ?? '—'} / ${(bench.latency_us && bench.latency_us.p99) ?? '—'} µs</span></div>
                  <div class="kv-line"><span class="kv-k">Duration</span><span class="kv-v">${bench.duration_ms ?? '—'} ms</span></div>
                </div>
              ` : ''}
            </div>

            <div class="coal-card">
              <div class="kv-line"><span class="kv-k">LAN Multicast Discovery</span><span class="kv-v">${escapeHtml(STATE.status.multicast_addr || '239.255.0.1:2270')}</span></div>
              <div class="kv-line"><span class="kv-k">Mesh Socket</span><span class="kv-v">${escapeHtml(STATE.status.host || '—')} (UDP)</span></div>
            </div>
          </div>
        `;
      }

      return `
        <div class="coal-sheet">
          <div class="sheet-header">
            <div class="pill-tabs">
              ${[
                ['general', 'General'],
                ['routing', 'Routing & Proxy'],
                ['continuum', 'Continuum & X-Ray'],
                ['diagnostics', 'Diagnostics']
              ].map(([id, lbl]) => `
                <button type="button" class="pill-btn ${tab === id ? 'active' : ''}" data-settab="${id}">${lbl}</button>
              `).join('')}
            </div>
            <button type="button" class="sheet-close" data-close>✕</button>
          </div>
          <div class="sheet-body">${bodyHtml}</div>
        </div>
      `;
    }

    function render() {
      const ex = curExitDisplay();
      const open = STATE.sheet !== null;
      const stage = document.getElementById('stage-root');
      const dock = document.getElementById('dock-root');

      const verEl = document.getElementById('app-version');
      if (verEl) verEl.textContent = 'v' + STATE.version;

      const pill = document.getElementById('titlebar-update-pill');
      if (pill) {
        if (STATE.updateInfo && STATE.updateInfo.update_available) {
          pill.style.display = 'inline-flex';
          pill.textContent = STATE.updateApplying
            ? '⏳ Installing Update...'
            : `⚡ Update to v${STATE.updateInfo.latest_version}`;
        } else {
          pill.style.display = 'none';
        }
      }

      if (!open) {
        const speedLine = STATE.connected
          ? `↓ ${formatBytes(STATE.downSpeed)}/s · ↑ ${formatBytes(STATE.upSpeed)}/s`
          : ex.sub;
        stage.innerHTML = `
          <div class="hero-grid">
            <div class="flank-card left" data-act="open-exits" title="Click to choose Exit Gateway">
              <div class="flank-head">
                <span>Exit Gateway</span>
                <span>▾</span>
              </div>
              <div class="flank-value">${escapeHtml(ex.title)}</div>
              <div class="flank-sub">${escapeHtml(speedLine)}</div>
            </div>

            <div class="center-btn-wrap">
              ${STATE.pulse ? `<div class="ring-pulse"></div>` : ''}
              <button type="button" class="center-btn-steel" data-act="toggle" aria-label="Toggle Protection">
                <div class="center-btn-core">
                  <span class="center-led ${STATE.connected ? 'on' : ''}"></span>
                  <span class="center-status-label">${STATE.connected ? 'Protected' : 'Off'}</span>
                </div>
              </button>
            </div>

            <div class="flank-card right" data-act="cycle-mode" title="Click to switch protection mode">
              <div class="flank-head">
                <span>Mode</span>
                <span>↻</span>
              </div>
              <div class="flank-value">${escapeHtml(STATE.mode)}</div>
              <div class="mode-pills">
                ${['Fast', 'Stealth', 'Multi-Hop'].map(m => `
                  <button type="button" class="mini-pill ${STATE.mode === m ? 'active' : ''}" data-set-mode="${m}">${m}</button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      } else if (STATE.sheet === 'qr') {
        stage.innerHTML = renderQrSheet();
      } else if (STATE.sheet === 'devices') {
        stage.innerHTML = renderDevicesSheet();
      } else {
        stage.innerHTML = renderSettingsSheet();
      }

      const exitPills = dockExitOptions();
      dock.innerHTML = `
        <div class="dock-cluster">
          ${exitPills.map(opt => {
            const act = opt.id === ex.id && !open;
            return `<button type="button" class="pill-btn ${act ? 'active' : ''}" data-exit-opt="${escapeHtml(opt.id)}">${escapeHtml(opt.label)}</button>`;
          }).join('')}
        </div>
        <div class="dock-cluster">
          ${[
            ['qr', '+ Pair Phone (QR)'],
            ['devices', `Devices (${STATE.peers.length})`],
            ['settings', 'Settings']
          ].map(([id, label]) => `
            <button type="button" class="pill-btn ${STATE.sheet === id ? 'active' : ''}" data-sheet="${id}">${escapeHtml(label)}</button>
          `).join('')}
        </div>
      `;

      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll('[data-act="toggle"]').forEach(b => b.addEventListener('click', toggleConnection));
      document.querySelectorAll('[data-act="open-exits"]').forEach(b => b.addEventListener('click', () => {
        STATE.sheet = 'devices';
        STATE.devicesTab = 'list';
        refreshTopology();
        render();
      }));
      document.querySelectorAll('[data-set-mode]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        setModeDirect(b.dataset.setMode);
      }));
      document.querySelectorAll('[data-act="cycle-mode"]').forEach(b => b.addEventListener('click', cycleMode));
      document.querySelectorAll('[data-exit-opt]').forEach(b => b.addEventListener('click', () => selectExitOption(b.dataset.exitOpt)));
      document.querySelectorAll('[data-sheet]').forEach(b => b.addEventListener('click', () => {
        const s = b.dataset.sheet;
        STATE.sheet = STATE.sheet === s ? null : s;
        if (STATE.sheet === 'qr') fetchInvite();
        if (STATE.sheet === 'devices') refreshTopology();
        if (STATE.sheet === 'settings') {
          loadSettings();
          refreshAnchors();
          if (STATE.settingsTab === 'continuum') { refreshContinuum(); refreshXray(); }
        }
        render();
      }));
      document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { STATE.sheet = null; render(); }));
      document.querySelectorAll('[data-qrtab]').forEach(b => b.addEventListener('click', () => { STATE.qrTab = b.dataset.qrtab; render(); }));
      document.querySelectorAll('[data-devtab]').forEach(b => b.addEventListener('click', () => { STATE.devicesTab = b.dataset.devtab; render(); }));
      document.querySelectorAll('[data-settab]').forEach(b => b.addEventListener('click', () => {
        STATE.settingsTab = b.dataset.settab;
        if (STATE.settingsTab === 'continuum') { refreshContinuum(); refreshXray(); }
        render();
      }));
      document.querySelectorAll('[data-mfilter]').forEach(b => b.addEventListener('click', () => { STATE.meshFilter = b.dataset.mfilter; render(); }));
      document.querySelectorAll('[data-act="toggle-hops"]').forEach(b => b.addEventListener('click', () => { STATE.showHopOverlay = !STATE.showHopOverlay; render(); }));
      document.querySelectorAll('[data-inspect-fp]').forEach(el => el.addEventListener('click', () => { STATE.inspectedFp = el.dataset.inspectFp; render(); }));
      document.querySelectorAll('[data-act="close-inspect"]').forEach(b => b.addEventListener('click', () => { STATE.inspectedFp = null; render(); }));
      document.querySelectorAll('[data-act="rename-peer"]').forEach(b => b.addEventListener('click', renameInspectedPeer));
      document.querySelectorAll('[data-act="copy-link"]').forEach(b => b.addEventListener('click', () => copyText(STATE.pairUri, 'Invite link')));
      document.querySelectorAll('[data-act="copy-fp"]').forEach(b => b.addEventListener('click', () => copyText(STATE.status.network_id, 'Fingerprint')));
      document.querySelectorAll('[data-act="copy-voucher"]').forEach(b => b.addEventListener('click', () => copyText(STATE.mintedVoucherHex, 'Voucher hex')));
      document.querySelectorAll('[data-act="copy-pac"]').forEach(b => b.addEventListener('click', () => copyText(window.location.origin + '/proxy.pac', 'PAC URL')));
      document.querySelectorAll('[data-act="mint-voucher"]').forEach(b => b.addEventListener('click', mintExitVoucher));
      document.querySelectorAll('[data-act="scan-lan"]').forEach(b => b.addEventListener('click', triggerLanScan));
      document.querySelectorAll('[data-act="add-device"]').forEach(b => b.addEventListener('click', linkDeviceFromInput));
      document.querySelectorAll('[data-pin-exit]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); pinHomeExit(b.dataset.pinExit); }));
      document.querySelectorAll('[data-remove-dev]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); disconnectPeer(b.dataset.removeDev); }));
      document.querySelectorAll('[data-setting-tog]').forEach(b => b.addEventListener('click', () => toggleSettingKey(b.dataset.settingTog)));
      document.querySelectorAll('[data-act="add-bypass"]').forEach(b => b.addEventListener('click', addBypassRule));
      document.querySelectorAll('[data-del-bypass]').forEach(b => b.addEventListener('click', () => removeBypassRule(b.dataset.delBypass)));
      document.querySelectorAll('[data-act="clear-home-exit"]').forEach(b => b.addEventListener('click', clearHomeExit));
      document.querySelectorAll('[data-act="refresh-v2"]').forEach(b => b.addEventListener('click', () => { refreshContinuum(); refreshXray(); }));
      document.querySelectorAll('[data-act="run-bench"]').forEach(b => b.addEventListener('click', runPipelineBenchmark));
      document.querySelectorAll('[data-act="update-btn"]').forEach(b => b.addEventListener('click', triggerUpdateAction));

      const scanSel = document.getElementById('scan-interval-sel');
      if (scanSel) scanSel.addEventListener('change', (e) => saveSettingPatch({ private_mesh_scan_interval_secs: parseInt(e.target.value, 10) }, 'Scan interval updated'));
      const mixSel = document.getElementById('mix-batch-sel');
      if (mixSel) mixSel.addEventListener('change', (e) => {
        const ms = parseInt(e.target.value, 10);
        saveSettingPatch({ mix_batch_ms: ms, low_latency: ms <= 1 }, `Mix batch set to ${ms}ms`);
      });
      const jurSel = document.getElementById('jurisdiction-sel');
      if (jurSel) jurSel.addEventListener('change', (e) => saveSettingPatch({ jurisdiction_tag: e.target.value }, `Region set to ${e.target.value}`));
    }

    // ── Backend API Actions ──
    async function toggleConnection() {
      const next = !STATE.connected;
      STATE.connected = next;
      STATE.pulse = true;
      render();
      try {
        const res = await fetch('/api/connect', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ connected: next })
        });
        if (res.status === 401) openPinModal('PIN required to toggle protection.');
      } catch (_) {}
      setTimeout(() => { STATE.pulse = false; refreshStatus(); refreshTopology(); }, 800);
    }

    async function setModeDirect(targetMode) {
      STATE.mode = targetMode;
      render();
      try {
        await fetch('/api/mode', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ mode: modeToBackend(STATE.mode) })
        });
        notify(`Mode: ${STATE.mode}`);
      } catch (_) {}
    }

    async function cycleMode() {
      const modes = ['Fast', 'Stealth', 'Multi-Hop'];
      await setModeDirect(modes[(modes.indexOf(STATE.mode) + 1) % modes.length]);
    }

    async function selectExitOption(exitId) {
      STATE.sheet = null;
      STATE.pulse = true;
      render();
      try {
        if (exitId === 'auto') {
          await fetch('/api/v2/home-exit/clear', { method: 'POST', headers: pinHeaders() });
        } else {
          await fetch('/api/v2/home-exit/select', {
            method: 'POST',
            headers: pinHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ fingerprint: exitId })
          });
        }
        await refreshContinuum();
      } catch (_) {}
      setTimeout(() => { STATE.pulse = false; render(); }, 750);
    }

    async function fetchInvite() {
      try {
        const res = await fetch('/api/invite', { headers: pinHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        if (data.vb_uri) STATE.pairUri = data.vb_uri;
        if (data.qr_svg) STATE.qrSvg = data.qr_svg;
        if (STATE.sheet === 'qr') render();
      } catch (_) {}
    }

    async function mintExitVoucher() {
      const fp = (document.getElementById('voucher-peer-fp')?.value || '').trim();
      const host = (document.getElementById('voucher-allowed-host')?.value || '*').trim() || '*';
      const ttl = parseInt(document.getElementById('voucher-ttl-secs')?.value || '86400', 10) || 86400;
      if (!fp) { notify('Enter a guest peer fingerprint'); return; }
      STATE.voucherMinting = true;
      render();
      try {
        const res = await fetch('/api/exit/voucher', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ peer_fingerprint: fp, allowed_host: host, ttl_secs: ttl })
        });
        const data = await res.json();
        if (data.success && data.voucher_hex) {
          STATE.mintedVoucherHex = data.voucher_hex;
          notify('Exit voucher minted');
        } else {
          notify(data.error || 'Failed to mint voucher');
        }
      } catch (_) {
        notify('Voucher request failed');
      } finally {
        STATE.voucherMinting = false;
        render();
      }
    }

    async function triggerLanScan() {
      notify('Scanning local Wi-Fi for Vantablack nodes...');
      try {
        await fetch('/api/scan', { method: 'POST', headers: pinHeaders() });
        setTimeout(() => { refreshStatus(); refreshTopology(); }, 900);
      } catch (_) {}
    }

    async function linkDeviceFromInput() {
      const inp = document.getElementById('dev-inp');
      const val = inp ? inp.value.trim() : '';
      if (!val) { notify('Paste an invite link or IP:Port first'); return; }
      try {
        const res = await fetch('/api/peers/add', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ address: val })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          if (inp) inp.value = '';
          notify(data.message || 'Device linked');
          setTimeout(() => { refreshStatus(); refreshTopology(); }, 400);
        } else {
          notify(data.error || 'Could not link device');
        }
      } catch (_) { notify('Link request failed'); }
    }

    async function renameInspectedPeer() {
      if (!STATE.inspectedFp) return;
      const newName = (document.getElementById('rename-peer-inp')?.value || '').trim();
      await saveSettingPatch({ set_device_name: { [STATE.inspectedFp]: newName } }, 'Device name updated');
      refreshTopology();
    }

    async function disconnectPeer(fp) {
      try {
        const res = await fetch('/api/peers/disconnect', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ fingerprint: fp })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          if (STATE.inspectedFp === fp) STATE.inspectedFp = null;
          notify('Device disconnected');
          refreshStatus();
          refreshTopology();
        } else {
          notify(data.error || 'Could not disconnect peer');
        }
      } catch (_) {}
    }

    async function pinHomeExit(fp) {
      try {
        const res = await fetch('/api/v2/home-exit/select', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ fingerprint: fp })
        });
        const data = await res.json();
        if (res.ok) {
          notify(data.note || 'Pinned Home Exit');
          await refreshContinuum();
          render();
        } else {
          notify(data.error || 'Could not pin Home Exit');
        }
      } catch (_) {}
    }

    async function clearHomeExit() {
      try {
        await fetch('/api/v2/home-exit/clear', { method: 'POST', headers: pinHeaders() });
        notify('Cleared pinned Home Exit');
        await refreshContinuum();
        render();
      } catch (_) {}
    }

    async function toggleSettingKey(key) {
      const cur = key === 'adblock_enabled' ? (STATE.settings[key] !== false) : Boolean(STATE.settings[key]);
      const next = !cur;
      const patch = { [key]: next };
      if (key === 'low_latency') patch.mix_batch_ms = next ? 1 : 20;
      await saveSettingPatch(patch, 'Preference saved');
    }

    async function saveSettingPatch(patch, msg) {
      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(patch)
        });
        if (res.status === 401) { openPinModal('PIN required to update settings.'); return; }
        if (res.ok) {
          const data = await res.json();
          STATE.settings = Object.assign({}, STATE.settings, patch, data);
          render();
          if (msg) notify(msg);
        }
      } catch (_) {}
    }

    async function addBypassRule() {
      const inp = document.getElementById('bypass-inp');
      const rule = inp ? inp.value.trim() : '';
      if (!rule) return;
      await saveSettingPatch({ bypass_add: rule }, `Bypass added: ${rule}`);
      if (inp) inp.value = '';
    }

    async function removeBypassRule(rule) {
      await saveSettingPatch({ bypass_remove: rule }, `Bypass removed: ${rule}`);
    }

    async function runPipelineBenchmark() {
      if (STATE.benchmarkRunning) return;
      STATE.benchmarkRunning = true;
      render();
      try {
        const res = await fetch('/api/pipeline_probe', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ total_bytes: 2000000 })
        });
        const data = await res.json();
        if (res.ok && data.status === 'completed') {
          STATE.benchmarkResult = data;
          notify(`Benchmark: ${(Number(data.throughput_mbps || 0) / 8).toFixed(1)} MB/s`);
        } else {
          notify('Benchmark failed');
        }
      } catch (_) {
        notify('Benchmark request failed');
      } finally {
        STATE.benchmarkRunning = false;
        render();
      }
    }

    // ── Software Update Flow ──
    async function checkUpdateSilent(userInitiated) {
      if (STATE.updateChecking || STATE.updateApplying) return;
      STATE.updateChecking = true;
      if (userInitiated) render();
      try {
        const res = await fetch('/api/update/check');
        const data = await res.json();
        STATE.updateInfo = data;
        STATE.updateChecking = false;
        render();
        if (userInitiated) {
          if (data.update_available) await applyUpdateNow();
          else notify(`Vantablack v${data.current_version || STATE.version} is up to date`);
        }
      } catch (_) {
        STATE.updateChecking = false;
        render();
        if (userInitiated) notify('Could not reach GitHub update server');
      }
    }

    async function triggerUpdateAction() {
      if (STATE.updateApplying) return;
      if (STATE.updateInfo && STATE.updateInfo.update_available) await applyUpdateNow();
      else await checkUpdateSilent(true);
    }

    async function applyUpdateNow() {
      if (STATE.updateApplying) return;
      STATE.updateApplying = true;
      render();
      notify('Downloading update & restarting Vantablack...');
      try {
        const res = await fetch('/api/update/apply', { method: 'POST', headers: pinHeaders() });
        const data = await res.json();
        if (res.ok && data.success) {
          notify('Installing update — Vantablack will reopen automatically...');
          pollForRestart();
        } else {
          STATE.updateApplying = false;
          render();
          const fallbackUrl = (STATE.updateInfo && (STATE.updateInfo.windows_setup_url || STATE.updateInfo.html_url))
            || 'https://github.com/KELLERBABG/Vantablack/releases/latest';
          notify('Opening installer download...');
          nativeSend('open_url:' + fallbackUrl);
        }
      } catch (_) {
        pollForRestart();
      }
    }

    function pollForRestart() {
      let attempts = 0;
      const timer = setInterval(async () => {
        attempts++;
        try {
          const res = await fetch('/api/status');
          if (res.ok) { clearInterval(timer); window.location.reload(); }
        } catch (_) {
          if (attempts > 45) { clearInterval(timer); STATE.updateApplying = false; render(); }
        }
      }, 1500);
    }

    // ── Live Polling ──
    async function refreshStatus() {
      try {
        const res = await fetch('/api/status', { headers: pinHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        if (data.pin_required && !pinModalDismissed) openPinModal();
        STATE.status = data;
        if (data.version) STATE.version = data.version;
        if (typeof data.connected === 'boolean') STATE.connected = data.connected;
        if (data.mode) STATE.mode = backendToUiMode(data.mode);
        if (data.pair_uri && !STATE.pairUri) STATE.pairUri = data.pair_uri;

        const tp = data.throughput || data.traffic;
        if (tp) {
          const sent = tp.bytes_sent || 0;
          const recv = tp.bytes_recv || 0;
          const now = Date.now();
          if (STATE.prevTs !== null) {
            const dt = (now - STATE.prevTs) / 1000;
            if (dt > 0.1) {
              STATE.upSpeed = Math.max(0, (sent - STATE.prevSent) / dt);
              STATE.downSpeed = Math.max(0, (recv - STATE.prevRecv) / dt);
            }
          }
          STATE.prevSent = sent;
          STATE.prevRecv = recv;
          STATE.prevTs = now;
        }
        render();
      } catch (_) {}
    }

    async function refreshTopology() {
      try {
        const res = await fetch('/api/topology', { headers: pinHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        STATE.topology = data;
        STATE.peers = Array.isArray(data.peers) ? data.peers : [];
        render();
      } catch (_) {}
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/settings', { headers: pinHeaders() });
        if (!res.ok) return;
        STATE.settings = await res.json();
        render();
      } catch (_) {}
    }

    async function refreshAnchors() {
      try {
        const res = await fetch('/api/v1/anchors/status', { headers: pinHeaders() });
        if (!res.ok) return;
        STATE.anchors = await res.json();
        render();
      } catch (_) {}
    }

    async function refreshContinuum() {
      const fetchJson = async (p) => {
        const r = await fetch(p, { headers: pinHeaders() });
        return r.ok ? await r.json() : null;
      };
      const [he, btcr, ladder, racs] = await Promise.all([
        fetchJson('/api/v2/home-exit').catch(() => null),
        fetchJson('/api/v2/btcr').catch(() => null),
        fetchJson('/api/v2/ladder').catch(() => null),
        fetchJson('/api/v2/racs').catch(() => null)
      ]);
      STATE.continuum = { homeExit: he, btcr, ladder, racs };
      render();
    }

    async function refreshXray() {
      try {
        const res = await fetch('/api/v2/xray', { headers: pinHeaders() });
        if (!res.ok) return;
        STATE.xray = await res.json();
        render();
      } catch (_) {}
    }

    function openPinModal(errMsg) {
      const m = document.getElementById('pin-modal');
      const err = document.getElementById('pin-modal-error');
      if (!m) return;
      if (errMsg && err) { err.textContent = errMsg; err.style.display = 'block'; }
      else if (err) { err.style.display = 'none'; }
      m.classList.add('open');
    }

    function dismissPinModal() {
      const m = document.getElementById('pin-modal');
      if (m) m.classList.remove('open');
      pinModalDismissed = true;
    }

    async function submitPinModal(ev) {
      ev.preventDefault();
      const inp = document.getElementById('pin-modal-input');
      const pin = inp ? inp.value.trim() : '';
      if (!pin) return;
      sessionStorage.setItem(PIN_KEY, pin);
      pinModalDismissed = false;
      const res = await fetch('/api/status', { headers: pinHeaders() });
      const data = await res.json();
      if (data.pin_required) {
        sessionStorage.removeItem(PIN_KEY);
        openPinModal('Invalid PIN.');
        return;
      }
      dismissPinModal();
      refreshStatus();
      refreshTopology();
      loadSettings();
      fetchInvite();
    }

    // Boot
    render();
    refreshStatus();
    refreshTopology();
    loadSettings();
    fetchInvite();
    refreshContinuum();
    setTimeout(() => checkUpdateSilent(false), 1800);
    setInterval(refreshStatus, 3500);
    setInterval(refreshTopology, 6500);
  </script>
</body>
</html>
