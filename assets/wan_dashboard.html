<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vantablack — v{{VERSION}}</title>
  <style>
    :root {
      --coal-top: #232428;
      --coal-mid: #141518;
      --coal-deep: #0C0D0F;
      --ivory: #F4F1EA;
      --ivory-card: #EAE6DC;
      --ivory-muted: rgba(244, 241, 234, 0.58);
      --ivory-faint: rgba(244, 241, 234, 0.42);
      --hairline: rgba(255, 255, 255, 0.10);
      --surface-row: rgba(255, 255, 255, 0.045);
      --visor-glint: #DCFF02;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--coal-deep);
      color: var(--ivory);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .app-shell {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(90% 80% at 50% 36%, var(--coal-top) 0%, var(--coal-mid) 58%, var(--coal-deep) 100%);
    }

    /* ── Frameless Titlebar ── */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      z-index: 20;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--ivory);
      cursor: pointer;
    }

    .brand-version {
      font-size: 11px;
      color: var(--ivory-faint);
      font-variant-numeric: tabular-nums;
    }

    .update-pill {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--ivory);
      color: var(--coal-deep);
      font-size: 11px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .update-pill:hover {
      transform: scale(1.03);
    }

    .win-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--ivory-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .win-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--ivory);
    }
    .win-btn.close:hover {
      background: rgba(239, 68, 68, 0.22);
      color: #FCA5A5;
    }

    /* ── Center Stage ── */
    .stage {
      flex: 1;
      display: flex;
       flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      overflow-y: auto;
    }

    .hero-grid {
      width: 100%;
      max-width: 680px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 32px;
    }

    @media (max-width: 580px) {
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 20px;
        text-align: center;
      }
      .flank-left, .flank-right {
        text-align: center !important;
      }
    }

    .flank-left {
      text-align: left;
    }
    .flank-right {
      text-align: right;
    }

    .flank-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ivory-faint);
    }

    .flank-value {
      font-size: 21px;
      font-weight: 500;
      color: var(--ivory);
      margin-top: 3px;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }

    button.flank-value {
      cursor: pointer;
    }
    button.flank-value:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .flank-sub {
      font-size: 12px;
      color: var(--ivory-muted);
      margin-top: 2px;
    }

    /* ── Machined Brushed-Steel Center Button ── */
    .center-btn-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .center-btn-steel {
      width: 164px;
      height: 164px;
      border-radius: 999px;
      padding: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #46474C 0%, #707278 48%, #B9BAC0 100%);
      box-shadow:
        0 26px 52px -12px rgba(0, 0, 0, 0.72),
        0 6px 16px rgba(0, 0, 0, 0.42),
        inset 0 1px 1px rgba(255, 255, 255, 0.62),
        inset 0 -2px 4px rgba(0, 0, 0, 0.45);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .center-btn-steel:hover {
      transform: scale(1.028);
    }
    .center-btn-steel:active {
      transform: scale(0.965);
    }

    .center-btn-core {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 32%, #2B2D32 0%, #191A1D 75%, #121316 100%);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.14),
        0 3px 10px rgba(0, 0, 0, 0.55);
    }

    .center-led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.2);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .center-led.on {
      background: var(--ivory);
      box-shadow: 0 0 12px var(--ivory);
    }

    .center-status-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--ivory);
    }

    @keyframes pulseRing {
      0% { opacity: 0.52; transform: scale(0.88); }
      100% { opacity: 0; transform: scale(1.38); }
    }
    .ring-pulse {
      position: absolute;
      width: 196px;
      height: 196px;
      border-radius: 50%;
      border: 1px solid rgba(244, 241, 234, 0.28);
      pointer-events: none;
      animation: pulseRing 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* ── Sheet Cards (QR / Devices / Settings) ── */
    .coal-sheet {
      width: 100%;
      max-width: 560px;
      background: rgba(20, 21, 24, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55);
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 11px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sheet-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ivory);
    }

    .sheet-close {
      background: none;
      border: none;
      color: var(--ivory-muted);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .sheet-close:hover {
      color: var(--ivory);
      background: rgba(255, 255, 255, 0.06);
    }

    .pill-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn {
      padding: 6px 13px;
      border-radius: 999px;
      border: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: rgba(244, 241, 234, 0.68);
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .pill-btn:hover {
      color: var(--ivory);
    }
    .pill-btn.active {
      background: var(--ivory);
      color: var(--coal-deep);
    }

    .qr-card-spring {
      display: inline-block;
      padding: 14px;
      background: var(--ivory-card);
      border-radius: 24px;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.55);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .qr-card-spring:hover {
      transform: scale(1.035) rotate(-0.8deg);
    }
    .qr-card-spring svg {
      width: 184px;
      height: 184px;
      display: block;
    }

    .sheet-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      margin-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
    }

    .coal-row {
      background: var(--surface-row);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .device-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 210px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .input-pill-row {
      display: flex;
      gap: 8px;
    }

    .input-pill {
      flex: 1;
      padding: 9px 14px;
      font-size: 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--ivory);
      outline: none;
    }
    .input-pill:focus {
      border-color: rgba(244, 241, 234, 0.45);
    }

    .action-pill {
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 999px;
      border: none;
      background: var(--ivory);
      color: var(--coal-deep);
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .action-pill:hover {
      opacity: 0.92;
    }

    .subtle-pill {
      padding: 6px 13px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.09);
      color: var(--ivory);
      cursor: pointer;
    }
    .subtle-pill:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (max-width: 540px) {
      .settings-grid {
        grid-template-columns: 1fr;
      }
    }

    .setting-card {
      text-align: left;
      cursor: pointer;
      color: var(--ivory);
      font-family: inherit;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .setting-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.065);
    }

    .setting-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--ivory);
    }
    .setting-sub {
      font-size: 11px;
      color: var(--ivory-muted);
      margin-top: 2px;
    }

    .ivory-switch {
      width: 38px;
      height: 22px;
      border-radius: 999px;
      padding: 3px;
      display: inline-flex;
      align-items: center;
      transition: background-color 0.15s ease;
      flex-shrink: 0;
    }
    .ivory-knob {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ── Bottom Pill Dock ── */
    .bottom-dock {
      padding: 16px 24px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 20;
    }

    .dock-cluster {
      padding: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Toast & PIN Modal ── */
    .toast-pill {
      position: fixed;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 16px;
      border-radius: 999px;
      background: var(--ivory);
      color: var(--coal-deep);
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      z-index: 50;
      pointer-events: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
    }
    .modal-backdrop.open {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="app-shell" id="tab-mesh" data-multicast="239.255.0.1:2270">
    <!-- Frameless Titlebar -->
    <div class="titlebar" id="drag-handle">
      <div class="brand-group">
        <span class="brand-title" id="brand-home">Vantablack</span>
        <span class="brand-version" id="app-version">v{{VERSION}}</span>
        <button type="button" class="update-pill" id="titlebar-update-pill">⚡ Update Available</button>
      </div>
      <div class="win-controls titlebar-controls">
        <button type="button" class="win-btn" onclick="nativeSend('minimize')" title="Minimize">—</button>
        <button type="button" class="win-btn" onclick="nativeSend('maximize')" title="Maximize">□</button>
        <button type="button" class="win-btn close" onclick="nativeSend('close')" title="Close">✕</button>
      </div>
    </div>

    <!-- Center Stage -->
    <div class="stage" id="stage-root"></div>

    <!-- Bottom Pill Dock -->
    <div class="bottom-dock" id="dock-root"></div>

    <!-- Toast Notification -->
    <div class="toast-pill" id="toast-pill" style="display:none;"></div>
  </div>

  <!-- Optional Console PIN Modal -->
  <div class="modal-backdrop" id="pin-modal" role="dialog" aria-modal="true">
    <div class="coal-sheet" style="max-width: 380px;">
      <div class="sheet-header">
        <span class="sheet-title">Unlock Vantablack</span>
        <button type="button" class="sheet-close" onclick="dismissPinModal()">✕</button>
      </div>
      <form onsubmit="submitPinModal(event)">
        <div class="input-pill-row" style="margin-bottom: 10px;">
          <input type="password" id="pin-modal-input" class="input-pill" placeholder="Enter console PIN" autocomplete="off" />
          <button type="submit" class="action-pill">Unlock</button>
        </div>
        <div id="pin-modal-error" style="display:none; font-size:11px; color:#FCA5A5;"></div>
      </form>
    </div>
  </div>

  <script>
    const PIN_KEY = 'ggn-console-pin';
    let pinModalDismissed = false;

    const STATE = {
      version: '{{VERSION}}',
      connected: false,
      mode: 'Stealth',
      cityId: 'zurich',
      sheet: null, // null | 'qr' | 'devices' | 'settings'
      qrTab: 'phone', // 'phone' | 'guest'
      pulse: false,
      pairUri: '',
      guestUri: '',
      qrSvg: '',
      localBypass: true,
      radioBackup: true,
      quantumLock: true,
      updateChecking: false,
      updateApplying: false,
      updateInfo: null,
      cities: [
        { id: 'zurich',    city: 'Zurich',    country: 'Switzerland', endpoint: null },
        { id: 'reykjavik', city: 'Reykjavik', country: 'Iceland',     endpoint: null },
        { id: 'frankfurt', city: 'Frankfurt', country: 'Germany',     endpoint: null },
        { id: 'tokyo',     city: 'Tokyo',     country: 'Japan',       endpoint: null }
      ],
      devices: []
    };

    function nativeSend(action) {
      if (window.ipc && window.ipc.postMessage) {
        window.ipc.postMessage(action);
      }
    }

    const dragBar = document.getElementById('drag-handle');
    if (dragBar) {
      dragBar.addEventListener('mousedown', (e) => {
        if (e.target.closest('.win-btn') || e.target.closest('.titlebar-controls') || e.target.closest('button')) return;
        nativeSend('drag');
      });
    }

    document.getElementById('brand-home').addEventListener('click', () => {
      STATE.sheet = null;
      render();
    });

    document.getElementById('titlebar-update-pill').addEventListener('click', () => {
      triggerUpdateAction();
    });

    function storedPin() {
      return sessionStorage.getItem(PIN_KEY);
    }

    function pinHeaders(extra) {
      const headers = Object.assign({}, extra || {});
      const pin = storedPin();
      if (pin) headers['X-Pin'] = pin;
      return headers;
    }

    let toastTimer = null;
    function notify(msg) {
      const el = document.getElementById('toast-pill');
      if (!el) return;
      el.textContent = msg;
      el.style.display = 'block';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.style.display = 'none';
      }, 2400);
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function curCity() {
      return STATE.cities.find(c => c.id === STATE.cityId) || STATE.cities[0];
    }

    function modeToBackend(uiMode) {
      if (uiMode === 'Fast') return 'fast';
      if (uiMode === 'Multi-Hop') return 'multihop';
      return 'stealth';
    }

    function backendToUiMode(raw) {
      const m = String(raw || '').toLowerCase();
      if (m === 'fast' || m === 'direct') return 'Fast';
      if (m === 'multihop' || m === 'multi-hop' || m === 'paranoid') return 'Multi-Hop';
      return 'Stealth';
    }

    function toggleSwitchHtml(on) {
      return `
        <div class="ivory-switch" style="background:${on ? '#F4F1EA' : 'rgba(255,255,255,0.14)'};">
          <div class="ivory-knob" style="background:${on ? '#0C0D0F' : 'rgba(244,241,234,0.5)'}; transform:translateX(${on ? '16px' : '0px'});"></div>
        </div>
      `;
    }

    // ── Connected Liquid Tracks QR + Stealth Visor Ghost Renderer ──
    function hashSeedFromText(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619) >>> 0;
      }
      return h || 23;
    }

    function buildLiquidQrGrid(seed) {
      const N = 25;
      const grid = Array.from({ length: N }, () => Array(N).fill(false));
      function inFinder(r, c) {
        return (r < 8 && c < 8) || (r < 8 && c >= N - 8) || (r >= N - 8 && c < 8);
      }
      function inCenter(r, c) {
        return r >= 8 && r <= 16 && c >= 8 && c <= 16;
      }
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (inFinder(r, c) || inCenter(r, c)) continue;
          const isTiming = (r === 6 || c === 6) && ((r + c) % 2 === 0);
          const h = ((r * 31 + c * 17 + (seed & 0xffff)) * 2654435761) >>> 0;
          grid[r][c] = isTiming || ((h % 11) < 6);
        }
      }
      return grid;
    }

    function renderStealthVisorGhostEmblem() {
      return `
        <g transform="translate(8.15, 8.15)">
          <rect x="0" y="0" width="8.7" height="8.7" rx="2.5" fill="#0C0D0F" stroke="#EAE6DC" stroke-width="0.45" />
          <path d="M2.1 4.3
                   C2.1 1.8, 6.6 1.8, 6.6 4.3
                   L6.7 6.6
                   C6.2 6.1, 5.7 6.65, 5.15 6.65
                   C4.65 6.65, 4.35 6.15, 4.35 6.15
                   C4.35 6.15, 4.05 6.65, 3.55 6.65
                   C3.0 6.65, 2.5 6.1, 2.0 6.6
                   Z"
                fill="#F4F1EA" />
          <rect x="2.65" y="3.45" width="3.4" height="1.25" rx="0.62" fill="#0C0D0F" />
          <line x1="3.1" y1="3.85" x2="4.15" y2="3.85" stroke="#DCFF02" stroke-width="0.32" stroke-linecap="round" />
          <circle cx="5.25" cy="3.85" r="0.18" fill="#DCFF02" />
        </g>
      `;
    }

    function renderConnectedLiquidTracksQr(isGuest) {
      if (!isGuest && STATE.qrSvg && STATE.qrSvg.startsWith('<svg')) {
        return `<div class="qr-card-spring">${STATE.qrSvg}</div>`;
      }
      const N = 25;
      const uriText = isGuest ? (STATE.guestUri || 'vb-guest://24h') : (STATE.pairUri || 'vb-net://pair');
      const grid = buildLiquidQrGrid(hashSeedFromText(uriText));

      let bars = '';
      for (let r = 0; r < N; r++) {
        let c = 0;
        while (c < N) {
          if (!grid[r][c]) { c++; continue; }
          let end = c;
          while (end + 1 < N && grid[r][end + 1]) end++;
          const w = (end - c + 1) - 0.16;
          bars += `<rect x="${c + 0.08}" y="${r + 0.12}" width="${w}" height="0.76" rx="0.38" fill="#0C0D0F" />`;
          c = end + 1;
        }
      }

      const eye = (x, y) => `
        <g transform="translate(${x},${y})">
          <circle cx="3.5" cy="3.5" r="3.08" fill="none" stroke="#0C0D0F" stroke-width="0.95" />
          <circle cx="3.5" cy="3.5" r="1.52" fill="#0C0D0F" />
        </g>`;

      return `
        <div class="qr-card-spring">
          <svg viewBox="-1 -1 27 27" role="img" aria-label="Vantablack Connected Liquid Tracks QR">
            ${eye(0, 0)} ${eye(N - 7, 0)} ${eye(0, N - 7)}
            ${bars}
            ${renderStealthVisorGhostEmblem()}
          </svg>
        </div>
      `;
    }

    // ── Sheet Renderers ──
    function renderSheet() {
      if (STATE.sheet === 'qr') {
        const isGuest = STATE.qrTab === 'guest';
        return `
          <div class="coal-sheet" style="text-align:center;">
            <div class="sheet-header">
              <div class="pill-tabs">
                <button type="button" class="pill-btn ${!isGuest ? 'active' : ''}" data-qrtab="phone">Pair My Phone</button>
                <button type="button" class="pill-btn ${isGuest ? 'active' : ''}" data-qrtab="guest">24h Guest Pass</button>
              </div>
              <button type="button" class="sheet-close" data-close>Back ✕</button>
            </div>

            <div style="padding: 8px 0 6px;">
              ${renderConnectedLiquidTracksQr(isGuest)}
            </div>

            <div class="sheet-footer">
              <span style="font-size:11px; color:var(--ivory-muted); text-align:left;">
                ${isGuest ? 'Temporary 24-hour exit pass for a friend' : 'Scan with your phone camera or Vantablack Android app'}
              </span>
              <button type="button" class="subtle-pill" data-act="copy-link">Copy Link</button>
            </div>
          </div>
        `;
      }

      if (STATE.sheet === 'devices') {
        const listHtml = STATE.devices.length > 0
          ? STATE.devices.map(d => `
              <div class="coal-row">
                <div style="display:flex; align-items:center; gap:11px; text-align:left;">
                  <span style="width:8px; height:8px; border-radius:50%; background:var(--ivory); display:inline-block;"></span>
                  <div>
                    <div style="font-size:12px; font-weight:500;">${escapeHtml(d.name)}</div>
                    <div style="font-size:11px; color:var(--ivory-muted);">${escapeHtml(d.type)}</div>
                  </div>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <button type="button" data-use-exit="${escapeHtml(d.id)}"
                    style="padding:5px 12px; font-size:11px; font-weight:500; border-radius:999px; border:none; cursor:pointer; background:${d.activeExit ? '#F4F1EA' : 'rgba(255,255,255,0.08)'}; color:${d.activeExit ? '#0C0D0F' : '#F4F1EA'};">
                    ${d.activeExit ? 'Home Exit' : 'Use as Exit'}
                  </button>
                  ${d.removable ? `<button type="button" class="sheet-close" data-remove-dev="${escapeHtml(d.id)}">Remove</button>` : ''}
                </div>
              </div>
            `).join('')
          : `<div class="coal-row" style="justify-content:center; color:var(--ivory-muted); font-size:12px;">No linked devices yet — scan your QR code or paste an invite link below.</div>`;

        return `
          <div class="coal-sheet">
            <div class="sheet-header">
              <span class="sheet-title">Linked Devices (${STATE.devices.length})</span>
              <div style="display:flex; align-items:center; gap:6px;">
                <button type="button" class="subtle-pill" data-act="scan-lan">Find on Wi-Fi</button>
                <button type="button" class="sheet-close" data-close>✕</button>
              </div>
            </div>
            <div class="device-list">
              ${listHtml}
            </div>
            <div class="input-pill-row">
              <input id="dev-inp" type="text" class="input-pill" placeholder="Paste an invite link from another device..." />
              <button type="button" class="action-pill" data-act="add-device">Link Device</button>
            </div>
          </div>
        `;
      }

      const up = STATE.updateInfo;
      const hasUpdate = Boolean(up && up.update_available);
      let updateSubtitle = `Vantablack v${escapeHtml(STATE.version)} is up to date`;
      let updateBadge = 'Check';
      if (STATE.updateApplying) {
        updateSubtitle = 'Downloading & installing update...';
        updateBadge = 'Installing...';
      } else if (STATE.updateChecking) {
        updateSubtitle = 'Checking GitHub releases...';
        updateBadge = 'Checking...';
      } else if (hasUpdate) {
        updateSubtitle = `Vantablack v${escapeHtml(up.latest_version)} is ready to install`;
        updateBadge = `Install v${escapeHtml(up.latest_version)}`;
      }

      return `
        <div class="coal-sheet">
          <div class="sheet-header">
            <span class="sheet-title">Preferences</span>
            <button type="button" class="sheet-close" data-close>✕</button>
          </div>
          <div class="settings-grid">
            <button type="button" class="coal-row setting-card" data-tog="localBypass">
              <div>
                <div class="setting-title">Local Network Access</div>
                <div class="setting-sub">Keep printers &amp; LAN devices direct</div>
              </div>
              ${toggleSwitchHtml(STATE.localBypass)}
            </button>
            <button type="button" class="coal-row setting-card" data-tog="radioBackup">
              <div>
                <div class="setting-title">Off-Grid Radio Backup</div>
                <div class="setting-sub">Fallback to Skywave HF if internet is cut</div>
              </div>
              ${toggleSwitchHtml(STATE.radioBackup)}
            </button>
            <button type="button" class="coal-row setting-card" data-tog="quantumLock">
              <div>
                <div class="setting-title">Quantum Protection</div>
                <div class="setting-sub">Post-quantum key protection</div>
              </div>
              ${toggleSwitchHtml(STATE.quantumLock)}
            </button>
            <button type="button" class="coal-row setting-card" data-act="update-btn">
              <div>
                <div class="setting-title">App Updates</div>
                <div class="setting-sub">${updateSubtitle}</div>
              </div>
              <span style="padding:5px 12px; font-size:11px; font-weight:600; border-radius:999px; background:${hasUpdate ? '#F4F1EA' : 'rgba(255,255,255,0.09)'}; color:${hasUpdate ? '#0C0D0F' : '#F4F1EA'};">
                ${updateBadge}
              </span>
            </button>
          </div>
        </div>
      `;
    }

    function render() {
      const c = curCity();
      const open = STATE.sheet !== null;
      const stage = document.getElementById('stage-root');
      const dock = document.getElementById('dock-root');

      const verEl = document.getElementById('app-version');
      if (verEl) verEl.textContent = 'v' + STATE.version;

      const pill = document.getElementById('titlebar-update-pill');
      if (pill) {
        if (STATE.updateInfo && STATE.updateInfo.update_available) {
          pill.style.display = 'inline-flex';
          pill.textContent = STATE.updateApplying
            ? '⏳ Installing Update...'
            : `⚡ Update to v${STATE.updateInfo.latest_version}`;
        } else {
          pill.style.display = 'none';
        }
      }

      if (!open) {
        stage.innerHTML = `
          <div class="hero-grid">
            <div class="flank-left">
              <div class="flank-label">Location</div>
              <div class="flank-value">${escapeHtml(c.city)}</div>
              <div class="flank-sub">${escapeHtml(c.country)}</div>
            </div>

            <div class="center-btn-wrap">
              ${STATE.pulse ? `<div class="ring-pulse"></div>` : ''}
              <button type="button" class="center-btn-steel" data-act="toggle" aria-label="Toggle Protection">
                <div class="center-btn-core">
                  <span class="center-led ${STATE.connected ? 'on' : ''}"></span>
                  <span class="center-status-label">${STATE.connected ? 'Protected' : 'Off'}</span>
                </div>
              </button>
            </div>

            <div class="flank-right">
              <div class="flank-label">Mode</div>
              <button type="button" class="flank-value" data-act="cycle-mode">${escapeHtml(STATE.mode)}</button>
              <div class="flank-sub">${STATE.connected ? 'Encrypted' : 'Direct'}</div>
            </div>
          </div>
        `;
      } else {
        stage.innerHTML = renderSheet();
      }

      dock.innerHTML = `
        <div class="dock-cluster">
          ${STATE.cities.map(loc => {
            const act = loc.id === c.id && !open;
            return `
              <button type="button" class="pill-btn ${act ? 'active' : ''}" data-city="${escapeHtml(loc.id)}">
                ${escapeHtml(loc.city)}
              </button>
            `;
          }).join('')}
        </div>
        <div class="dock-cluster">
          ${[
            ['qr', '+ Pair Phone (QR)'],
            ['devices', `Devices (${STATE.devices.length})`],
            ['settings', 'Settings']
          ].map(([id, label]) => {
            const act = STATE.sheet === id;
            return `
              <button type="button" class="pill-btn ${act ? 'active' : ''}" data-sheet="${id}">
                ${escapeHtml(label)}
              </button>
            `;
          }).join('')}
        </div>
      `;

      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll('[data-act="toggle"]').forEach(b => {
        b.addEventListener('click', toggleConnection);
      });
      document.querySelectorAll('[data-act="cycle-mode"]').forEach(b => {
        b.addEventListener('click', cycleMode);
      });
      document.querySelectorAll('[data-city]').forEach(b => {
        b.addEventListener('click', () => selectCity(b.dataset.city));
      });
      document.querySelectorAll('[data-sheet]').forEach(b => {
        b.addEventListener('click', () => {
          const s = b.dataset.sheet;
          STATE.sheet = STATE.sheet === s ? null : s;
          if (STATE.sheet === 'qr') fetchInvite();
          if (STATE.sheet === 'devices') refreshPeers();
          render();
        });
      });
      document.querySelectorAll('[data-close]').forEach(b => {
        b.addEventListener('click', () => { STATE.sheet = null; render(); });
      });
      document.querySelectorAll('[data-qrtab]').forEach(b => {
        b.addEventListener('click', () => { STATE.qrTab = b.dataset.qrtab; render(); });
      });
      document.querySelectorAll('[data-act="copy-link"]').forEach(b => {
        b.addEventListener('click', copyInviteLink);
      });
      document.querySelectorAll('[data-act="scan-lan"]').forEach(b => {
        b.addEventListener('click', triggerLanScan);
      });
      document.querySelectorAll('[data-act="add-device"]').forEach(b => {
        b.addEventListener('click', linkDeviceFromInput);
      });
      document.querySelectorAll('[data-use-exit]').forEach(b => {
        b.addEventListener('click', () => selectDeviceAsExit(b.dataset.useExit));
      });
      document.querySelectorAll('[data-remove-dev]').forEach(b => {
        b.addEventListener('click', () => removeDevice(b.dataset.removeDev));
      });
      document.querySelectorAll('[data-tog]').forEach(b => {
        b.addEventListener('click', () => togglePreference(b.dataset.tog));
      });
      document.querySelectorAll('[data-act="update-btn"]').forEach(b => {
        b.addEventListener('click', triggerUpdateAction);
      });
    }

    // ── Backend Actions ──
    async function toggleConnection() {
      const next = !STATE.connected;
      STATE.connected = next;
      STATE.pulse = true;
      render();
      try {
        const res = await fetch('/api/connect', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ connected: next })
        });
        if (res.status === 401) {
          openPinModal('PIN required to toggle protection.');
        }
      } catch (_) {}
      setTimeout(() => { STATE.pulse = false; refreshStatus(); }, 800);
    }

    async function cycleMode() {
      const modes = ['Fast', 'Stealth', 'Multi-Hop'];
      STATE.mode = modes[(modes.indexOf(STATE.mode) + 1) % modes.length];
      render();
      try {
        await fetch('/api/mode', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ mode: modeToBackend(STATE.mode) })
        });
      } catch (_) {}
    }

    async function selectCity(cityId) {
      STATE.cityId = cityId;
      STATE.sheet = null;
      const wasOff = !STATE.connected;
      STATE.connected = true;
      STATE.pulse = true;
      render();
      const chosen = curCity();
      try {
        if (chosen && chosen.endpoint) {
          await fetch('/api/exit/select', {
            method: 'POST',
            headers: pinHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ exit: chosen.endpoint })
          });
        }
        if (wasOff) {
          await fetch('/api/connect', {
            method: 'POST',
            headers: pinHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ connected: true })
          });
        }
      } catch (_) {}
      setTimeout(() => { STATE.pulse = false; render(); }, 850);
    }

    async function fetchInvite() {
      try {
        const res = await fetch('/api/invite', { headers: pinHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        if (data.vb_net_uri || data.vb_uri) {
          STATE.pairUri = data.vb_net_uri || data.vb_uri;
          STATE.guestUri = data.vb_uri || data.vb_net_uri;
        }
        if (data.qr_svg) {
          STATE.qrSvg = data.qr_svg;
        }
        if (STATE.sheet === 'qr') render();
      } catch (_) {}
    }

    function copyInviteLink() {
      const isGuest = STATE.qrTab === 'guest';
      const link = isGuest
        ? (STATE.guestUri || STATE.pairUri)
        : (STATE.pairUri || STATE.guestUri);
      if (!link) {
        notify('Generating invite link...');
        fetchInvite();
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link)
          .then(() => notify('Invite link copied to clipboard'))
          .catch(() => notify('Could not access clipboard'));
      }
    }

    async function triggerLanScan() {
      notify('Scanning local network for devices...');
      try {
        await fetch('/api/peers/scan', { method: 'POST', headers: pinHeaders() });
        setTimeout(refreshPeers, 700);
      } catch (_) {}
    }

    async function linkDeviceFromInput() {
      const inp = document.getElementById('dev-inp');
      const val = inp ? inp.value.trim() : '';
      if (!val) {
        notify('Paste an invite link first');
        return;
      }
      try {
        const res = await fetch('/api/peers/add', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ address: val })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          if (inp) inp.value = '';
          notify('Device linked');
          refreshPeers();
        } else {
          notify(data.error || 'Invalid invite link');
        }
      } catch (_) {
        notify('Could not link device');
      }
    }

    async function selectDeviceAsExit(id) {
      const dev = STATE.devices.find(d => d.id === id);
      if (!dev) return;
      STATE.devices.forEach(d => { d.activeExit = (d.id === id); });
      render();
      try {
        await fetch('/api/exit/select', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ exit: dev.endpoint || dev.id })
        });
        notify(`Routing through ${dev.name}`);
      } catch (_) {}
    }

    async function removeDevice(id) {
      const dev = STATE.devices.find(d => d.id === id);
      if (!dev) return;
      try {
        await fetch('/api/peers/disconnect', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ peer: dev.endpoint || dev.id })
        });
        STATE.devices = STATE.devices.filter(d => d.id !== id);
        render();
        notify('Device removed');
      } catch (_) {}
    }

    async function togglePreference(key) {
      STATE[key] = !STATE[key];
      render();
      try {
        await fetch('/api/settings', {
          method: 'POST',
          headers: pinHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            lan_bypass: STATE.localBypass,
            pq_strict: STATE.quantumLock
          })
        });
      } catch (_) {}
    }

    // ── Software Update Flow (Check + Instant Install) ──
    async function checkUpdateSilent(userInitiated) {
      if (STATE.updateChecking || STATE.updateApplying) return;
      STATE.updateChecking = true;
      if (userInitiated) render();
      try {
        const res = await fetch('/api/update/check');
        const data = await res.json();
        STATE.updateInfo = data;
        STATE.updateChecking = false;
        render();
        if (userInitiated) {
          if (data.update_available) {
            await applyUpdateNow();
          } else {
            notify(`Vantablack v${data.current_version || STATE.version} is up to date`);
          }
        }
      } catch (_) {
        STATE.updateChecking = false;
        render();
        if (userInitiated) notify('Could not reach GitHub update server');
      }
    }

    async function triggerUpdateAction() {
      if (STATE.updateApplying) return;
      if (STATE.updateInfo && STATE.updateInfo.update_available) {
        await applyUpdateNow();
      } else {
        await checkUpdateSilent(true);
      }
    }

    async function applyUpdateNow() {
      if (STATE.updateApplying) return;
      STATE.updateApplying = true;
      render();
      notify('Downloading update & restarting Vantablack...');
      try {
        const res = await fetch('/api/update/apply', {
          method: 'POST',
          headers: pinHeaders()
        });
        const data = await res.json();
        if (res.ok && data.success) {
          notify('Installing update — Vantablack will reopen automatically...');
          pollForRestart();
        } else {
          STATE.updateApplying = false;
          render();
          const fallbackUrl = (STATE.updateInfo && (STATE.updateInfo.windows_setup_url || STATE.updateInfo.html_url))
            || 'https://github.com/KELLERBABG/Vantablack/releases/latest';
          notify('Opening installer download...');
          nativeSend('open_url:' + fallbackUrl);
        }
      } catch (_) {
        // Node may already be exiting for self-update
        pollForRestart();
      }
    }

    function pollForRestart() {
      let attempts = 0;
      const timer = setInterval(async () => {
        attempts++;
        try {
          const res = await fetch('/api/status');
          if (res.ok) {
            clearInterval(timer);
            window.location.reload();
          }
        } catch (_) {
          if (attempts > 45) {
            clearInterval(timer);
            STATE.updateApplying = false;
            render();
          }
        }
      }, 1500);
    }

    // ── Status & Peer Polling ──
    async function refreshStatus() {
      try {
        const res = await fetch('/api/status', { headers: pinHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        if (data.pin_required && !pinModalDismissed) {
          openPinModal();
        }
        if (data.version) STATE.version = data.version;
        if (typeof data.connected === 'boolean') STATE.connected = data.connected;
        if (data.mode) STATE.mode = backendToUiMode(data.mode);
        if (data.pair_uri && !STATE.pairUri) STATE.pairUri = data.pair_uri;
        render();
      } catch (_) {}
    }

    async function refreshPeers() {
      try {
        const res = await fetch('/api/peers', { headers: pinHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        const peers = Array.isArray(data.peers) ? data.peers : [];
        const selectedExit = data.selected_exit || '';
        STATE.devices = peers.map(p => ({
          id: p.fingerprint || p.address || p.id || 'peer',
          name: p.name || p.label || (p.is_self ? 'This Device' : (p.address || 'Linked Peer')),
          type: p.is_exit ? 'Exit Node' : (p.scope || 'Mesh Peer'),
          endpoint: p.address || p.fingerprint,
          activeExit: Boolean(selectedExit && (p.address === selectedExit || p.fingerprint === selectedExit)) || Boolean(p.selected_exit),
          removable: !p.is_self
        }));
        render();
      } catch (_) {}
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/settings', { headers: pinHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        if (typeof data.lan_bypass === 'boolean') STATE.localBypass = data.lan_bypass;
        if (typeof data.pq_strict === 'boolean') STATE.quantumLock = data.pq_strict;
        render();
      } catch (_) {}
    }

    function openPinModal(errMsg) {
      const m = document.getElementById('pin-modal');
      const err = document.getElementById('pin-modal-error');
      if (!m) return;
      if (errMsg && err) {
        err.textContent = errMsg;
        err.style.display = 'block';
      } else if (err) {
        err.style.display = 'none';
      }
      m.classList.add('open');
    }

    function dismissPinModal() {
      const m = document.getElementById('pin-modal');
      if (m) m.classList.remove('open');
      pinModalDismissed = true;
    }

    async function submitPinModal(ev) {
      ev.preventDefault();
      const inp = document.getElementById('pin-modal-input');
      const pin = inp ? inp.value.trim() : '';
      if (!pin) return;
      sessionStorage.setItem(PIN_KEY, pin);
      pinModalDismissed = false;
      const res = await fetch('/api/status', { headers: pinHeaders() });
      const data = await res.json();
      if (data.pin_required) {
        sessionStorage.removeItem(PIN_KEY);
        openPinModal('Invalid PIN.');
        return;
      }
      dismissPinModal();
      refreshStatus();
      refreshPeers();
      fetchInvite();
    }

    // Boot
    render();
    refreshStatus();
    refreshPeers();
    loadSettings();
    fetchInvite();
    setTimeout(() => checkUpdateSilent(false), 1800);
    setInterval(refreshStatus, 3500);
    setInterval(refreshPeers, 6000);
  </script>
</body>
</html>
