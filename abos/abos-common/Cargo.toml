[package]
name = "abos-common"
version = "0.1.0"
edition = "2021"
description = "ABOS shared types and utilities"

[dependencies]
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "1"
rand = "0.8"
rand_chacha = "0.3"
aes-gcm = "0.10"
chacha20 = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
hmac = "0.12"

[features]
default = []