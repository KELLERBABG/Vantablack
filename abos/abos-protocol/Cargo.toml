[package]
name = "abos-protocol"
version = "0.1.0"
edition = "2021"
description = "ABOS Protocol Layer - Shard splitting, DTN bundle, Buffer-Bounce, scheduler"

[dependencies]
abos-common = { path = "../abos-common" }
abos-storage = { path = "../abos-storage" }
abos-phy = { path = "../abos-phy" }
bincode = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"