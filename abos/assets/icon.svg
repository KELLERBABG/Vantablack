<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="abos-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="abos-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071329"/>
      <stop offset="100%" stop-color="#02050b"/>
    </linearGradient>
    <linearGradient id="abos-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="abos-glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#02050b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#abos-bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#abos-glow)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#abos-border)" stroke-width="1.5"/>

  <!-- Ionospheric Reflective Canopy (Upper Outer Arc) -->
  <path d="M 48 22 Q 64 14 80 22" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Primary Atmospheric Wavefront (Inner Arc) -->
  <path d="M 38 32 Q 64 20 90 32" fill="none" stroke="#38bdf8" stroke-width="4.2" stroke-linecap="round"/>

  <!-- Iconic 'A' Skywave Transmitter Ribbon -->
  <path d="M 34 100 L 58 44 C 60 39, 68 39, 70 44 L 94 100" fill="none" stroke="url(#abos-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crossbar Wave Frequency Horizon -->
  <line x1="44" y1="78" x2="84" y2="78" stroke="url(#abos-grad)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Zenith Pulse Node -->
  <circle cx="64" cy="78" r="3.5" fill="#f8fafc"/>
</svg>