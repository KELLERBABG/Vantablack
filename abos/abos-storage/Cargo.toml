[package]
name = "abos-storage"
version = "0.1.0"
edition = "2021"
description = "ABOS Persistent Storage - DTN bundle store, configuration"

[dependencies]
abos-common = { path = "../abos-common" }
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sled = "0.34"
tokio = { version = "1", features = ["full"] }
