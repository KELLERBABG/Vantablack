name: CI / Build & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite (Unit + Integration + VPN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop (GTK/WebKit) system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Default features include the native desktop window, so this also proves
      # the GUI target compiles on Linux.
      - name: Run Core Tests
        run: cargo test --all-targets --verbose

      - name: Run VPN Subsystem Tests
        run: cargo test --features vpn --verbose

      - name: Run DPI & Traffic-Analysis Measurements
        run: cargo test --test dpi_fingerprint --verbose

      - name: Run Cover Traffic & Traffic-Shaping Tests
        run: cargo test --test cover_traffic --verbose

      - name: Run Control Center API & SOCKS5 E2E Tests
        run: cargo test --test control_center_api --verbose

      # The headless/server build must keep working: servers and containers use
      # `--no-default-features` and need no GTK/WebKit and no display.
      - name: Verify Headless (server) Build
        run: cargo check --no-default-features --all-targets --verbose

      # `hardware-tpm` / `pkcs11` must gate code that actually
      # compiles. These backends previously sat in a module no `mod` declaration
      # referenced, so the features gated nothing and were never built by CI.
      - name: Verify HSM Feature Gates (hardware-tpm + pkcs11)
        run: cargo check --features hardware-tpm,pkcs11 --all-targets --verbose

      # The QUIC carrier is behind a feature, so without this step it
      # would be the same kind of never-built code the HSM step above exists to
      # catch. The gate (`tests/p1_quic.rs`) and the framing decisions in
      # `net/quic.rs` only compile — and only run — under this feature.
      - name: Verify QUIC Carrier (quic + vpn)
        run: |
          cargo check --features quic --all-targets --verbose
          cargo test --features quic --verbose
          cargo check --features "quic vpn" --all-targets --verbose

  clippy-fmt:
    name: Code Hygiene & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install desktop (GTK/WebKit) system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Check Formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings || true

  windows-installer:
    name: Windows Installer (build, install, verify, uninstall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-installer

      # Inno Setup turns the staged payload into a real application install.
      # Present on most runner images; Chocolatey is the fallback.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $found = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source,
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          if ($found) {
            Write-Host "Inno Setup already present: $($found[0])"
          } else {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: ./scripts/build_installer.ps1

      # Compiling is not the same as working. Run the real install cycle and
      # assert on the artefacts Windows itself reads, then uninstall and check
      # that user data survives — the identity key must never be collateral.
      - name: Install, verify and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $setup = (Get-ChildItem dist\*-windows-setup.exe | Select-Object -First 1).FullName
          if (-not $setup) { throw 'the build produced no installer' }

          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\GlobalGhostNet'
          $startMenu  = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Global Ghost Net.lnk'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $appPathKey   = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\ggn.exe'

          Write-Host "Installing $setup"
          $p = Start-Process -FilePath $setup `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup.exe exited $($p.ExitCode)" }

          $ggnExe = Join-Path $installDir 'ggn.exe'
          $checks = [ordered]@{
            'ggn.exe installed'   = Test-Path -LiteralPath $ggnExe
            'uninstaller present' = Test-Path -LiteralPath (Join-Path $installDir 'unins000.exe')
            'Start Menu shortcut' = Test-Path -LiteralPath $startMenu
            'Add/Remove entry'    = [bool](Get-ChildItem $uninstallKey |
                                      Where-Object { $_.PSChildName -like '{8CF92C03*' })
            'App Paths entry'     = [bool](Get-ItemProperty $appPathKey -ErrorAction SilentlyContinue)
            'version readable'    = -not [string]::IsNullOrWhiteSpace(
                                      (Get-Item -LiteralPath $ggnExe).VersionInfo.ProductVersion)
          }
          $failed = 0
          foreach ($name in $checks.Keys) {
            $state = if ($checks[$name]) { 'ok  ' } else { 'FAIL'; $failed++ }
            Write-Host "  $state $name"
          }
          if ($failed -gt 0) { throw "$failed installer check(s) failed" }

          # The installed binary has to actually run, keep its state out of the
          # install directory, and answer its control center. GHOST_NO_GUI keeps
          # this independent of whether the runner has a desktop session.
          $env:GHOST_NO_GUI = '1'
          $env:GHOST_WEB_PORT = '8231'
          $proc = Start-Process -FilePath $ggnExe -WorkingDirectory $installDir -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                if ((Invoke-WebRequest 'http://127.0.0.1:8231/api/status' -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw 'the installed application never answered its control center' }

            $dataDir = Join-Path $env:APPDATA 'GlobalGhostNet'
            if (-not (Test-Path -LiteralPath (Join-Path $dataDir 'identity.key'))) {
              throw 'no identity was written to the per-user data directory'
            }
            $strays = @(Get-ChildItem $installDir -File |
              Where-Object { $_.Name -in @('identity.key','peers.cache','ghost-consumer.json','ghost.log') })
            if ($strays.Count -gt 0) {
              throw "state leaked into the install directory: $($strays.Name -join ', ')"
            }
            Write-Host '  ok   installed app ran and used the per-user data directory'
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

          Write-Host 'Uninstalling'
          $u = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exited $($u.ExitCode)" }
          Start-Sleep -Seconds 5

          $after = [ordered]@{
            'install files removed'  = -not (Test-Path -LiteralPath $ggnExe)
            'Start Menu entry'       = -not (Test-Path -LiteralPath $startMenu)
            'Add/Remove entry'       = -not [bool](Get-ChildItem $uninstallKey |
                                        Where-Object { $_.PSChildName -like '{8CF92C03*' })
            'App Paths entry'        = -not [bool](Get-ItemProperty $appPathKey -ErrorAction SilentlyContinue)
            'user data preserved'    = Test-Path -LiteralPath (Join-Path $env:APPDATA 'GlobalGhostNet\identity.key')
          }
          $failed = 0
          foreach ($name in $after.Keys) {
            $state = if ($after[$name]) { 'ok  ' } else { 'FAIL'; $failed++ }
            Write-Host "  $state $name"
          }
          if ($failed -gt 0) { throw "$failed uninstall check(s) failed" }

  windows-vpn:
    name: Windows Real Wintun Driver & VPN Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-vpn

      - name: Download & Install Wintun Driver
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun-pkg"
          Copy-Item "wintun-pkg\wintun\bin\amd64\wintun.dll" -Destination "."
          Copy-Item "wintun-pkg\wintun\bin\amd64\wintun.dll" -Destination "C:\Windows\System32\"
          Write-Host "wintun.dll installed successfully"

      - name: Run Wintun Device Tests
        shell: pwsh
        run: |
          cargo test --features vpn --test vpn_wintun -- --nocapture

  docker-wan:
    name: Level 1 Kernel Netem Multi-Container Mesh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Launch Level 1 WAN Mesh Containers
        # All seven services in this compose file build the same Dockerfile, so a
        # plain `up --build` fans out seven concurrent, unauthenticated requests
        # to Docker Hub. Its auth endpoint resets that burst -- "failed to fetch
        # oauth token ... write: connection reset by peer" -- which is a
        # registry-side flake, not a build error. Pre-pull the two base images
        # once, serialise the builds, and retry, so it cannot fail the job.
        env:
          COMPOSE_PARALLEL_LIMIT: "1"
        run: |
          for image in rust:1.85-slim-bookworm debian:bookworm-slim; do
            for attempt in 1 2 3 4 5; do
              if docker pull "$image"; then break; fi
              echo "docker pull $image failed (attempt $attempt); retrying"
              sleep $(( attempt * 5 ))
            done
            if ! docker image inspect "$image" > /dev/null 2>&1; then
              echo "::error::could not pull base image $image from Docker Hub"
              exit 1
            fi
          done

          built=0
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.wan.yml up -d --build; then
              built=1
              break
            fi
            echo "compose up failed (attempt $attempt); retrying"
            sleep $(( attempt * 15 ))
          done
          if [ "$built" -ne 1 ]; then
            echo "::error::docker compose up failed after 3 attempts"
            exit 1
          fi
          docker compose -f docker-compose.wan.yml ps

          sleep 15
          docker ps
          docker logs vantablack-carrier-1
          docker logs vantablack-carrier-2
          docker logs vantablack-carrier-3
          docker logs vantablack-exit
          docker logs --tail 30 vantablack-client
          
      - name: Verify Client RS(2,1) Recovery
        run: |
          sleep 10
          CLIENT_LOGS=$(docker logs --tail 50 vantablack-client)
          echo "$CLIENT_LOGS"
          if echo "$CLIENT_LOGS" | grep -q "SUCCESS! Reconstructed Google HTTP Response through RS(2,1)"; then
            echo "WAN Mesh Kernel Verification Passed!"
          else
            echo "Warning: Shards in flight, checking exit logs"
            docker logs --tail 30 vantablack-exit
          fi

  fuzz:
    name: Fuzz Smoke Gates (libFuzzer 30s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Nightly (required for cargo-fuzz)
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-cache

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Smoke Fuzz Targets Against Committed Corpora
        run: |
          for target in fuzz_handle_pkt fuzz_parse_handshake_pdu fuzz_kyber_ciphertext fuzz_build_gtf_frame fuzz_parse_relay_header fuzz_unframe fuzz_parse_quic_binding; do
            echo "=== Fuzzing target: $target for 30 seconds ==="
            cargo fuzz run "$target" -- -max_total_time=30 || exit 1
          done

  formal-model:
    name: ProVerif Formal Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ProVerif
        run: |
          sudo apt-get update
          sudo apt-get install -y proverif

      - name: Verify Handshake, Ratchet & Replay Protection
        run: proverif formal/ghost_session.pv

      - name: Verify ShardSec 3-Shard Space-Time Secrecy
        run: proverif formal/shardsec_space_time.pv

