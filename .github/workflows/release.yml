name: build-and-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Override the space-free target-dir hack from .cargo/config.toml (Windows
  # only) with a portable workspace-local dir on every runner.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  RUSTFLAGS: ""

jobs:
  test:
    name: tests (rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The pristine v0.4.0 surface: no optional features compiled.
      - name: cargo test (default features)
        run: cargo test --locked
      # The LAN-over-WAN subsystem is feature-gated. Without this step it is
      # never compiled in CI, so the whole VPN path can rot silently and the
      # "merge only with its verification gate green" rule cannot be enforced.
      - name: cargo test (--features vpn)
        run: cargo test --locked --features vpn
      # Zero-elevation, two-process end-to-end proof of the tunnel path:
      # real UDP, real hybrid handshake, real seal/open, client on the
      # in-memory TUN (no wintun.dll, no Administrator, no OS interface).
      - name: vpn loopback self-test
        shell: bash
        run: bash scripts/vpn_loopback_test.sh
      - name: clippy (warnings not yet fatal — Phase 3 cleanup)
        run: cargo clippy --all-targets --features vpn

  build-windows:
    name: vantablack (windows x86_64-msvc)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build release
        run: cargo build --release --locked --bin vantablack
      - name: package
        run: |
          mkdir dist
          Copy-Item target/release/vantablack.exe dist/vantablack-windows-x86_64.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath vantablack-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vantablack-windows-x86_64
          path: vantablack-windows-x86_64.zip

  build-linux:
    name: vantablack (linux x86_64-musl static)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build release (static musl)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl --bin vantablack
      - name: package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/vantablack dist/vantablack-linux-x86_64
          cp README.md dist/
          tar -C dist -czf vantablack-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: vantablack-linux-x86_64
          path: vantablack-linux-x86_64.tar.gz

  build-macos-intel:
    name: vantablack (macos x86_64)
    runs-on: macos-13
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: build release
        run: cargo build --release --locked --target x86_64-apple-darwin --bin vantablack
      - name: package
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/vantablack dist/vantablack-macos-x86_64
          cp README.md dist/
          tar -C dist -czf vantablack-macos-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: vantablack-macos-x86_64
          path: vantablack-macos-x86_64.tar.gz

  build-macos-arm:
    name: vantablack (macos aarch64)
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: build release
        run: cargo build --release --locked --target aarch64-apple-darwin --bin vantablack
      - name: package
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/vantablack dist/vantablack-macos-aarch64
          cp README.md dist/
          tar -C dist -czf vantablack-macos-aarch64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: vantablack-macos-aarch64
          path: vantablack-macos-aarch64.tar.gz

  release:
    name: attach binaries to GitHub release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos-intel, build-macos-arm]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
