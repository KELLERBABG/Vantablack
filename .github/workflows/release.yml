name: Release Build & Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_ext: .exe
            archive_format: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_ext: ""
            archive_format: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_ext: ""
            archive_format: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install desktop (GTK/WebKit) build libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Default features build the desktop application (native window + tray).
      - name: Build release binaries (desktop GUI)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage desktop binary
        shell: bash
        run: |
          mkdir -p desktop-bin
          cp target/${{ matrix.target }}/release/ggn${{ matrix.binary_ext }} desktop-bin/

      # Server operators still get a dependency-free binary: no GTK/WebKit, no
      # display, HTTP control center only.
      - name: Build release binaries (headless)
        run: cargo build --release --no-default-features --target ${{ matrix.target }} --bin ggn

      - name: Stage headless binary and restore desktop binary
        shell: bash
        run: |
          mkdir -p headless
          cp target/${{ matrix.target }}/release/ggn${{ matrix.binary_ext }} headless/ggn-headless${{ matrix.binary_ext }}
          cp desktop-bin/ggn${{ matrix.binary_ext }} target/${{ matrix.target }}/release/ggn${{ matrix.binary_ext }}

      # Windows users get a real application install, not just an archive: a
      # per-user setup.exe with a Start Menu entry, an "Apps & Features" entry
      # and an uninstaller. Installers are built by Inno Setup; the runner image
      # usually has it, and Chocolatey is the fallback.
      - name: Ensure Inno Setup
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $found = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source,
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          if ($found) {
            Write-Host "Inno Setup already present: $($found[0])"
          } else {
            choco install innosetup --no-progress -y
          }

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build_installer.ps1 -BinDir "target/${{ matrix.target }}/release" -SkipBuild

      - name: Package Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/ggn.exe staging/
          if [ -f wintun.dll ]; then cp wintun.dll staging/; fi
          cp headless/ggn-headless.exe staging/
          cp README.md staging/
          cp LICENSE staging/ 2>/dev/null || true
          cd staging
          7z a ../ggn-${{ github.ref_name }}-${{ matrix.target }}.zip *
          cd ..

      - name: Package Unix artifacts (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/ggn staging/
          cp headless/ggn-headless staging/
          cp README.md staging/
          cp LICENSE staging/ 2>/dev/null || true
          tar -czvf ggn-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C staging .

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ggn-*.zip
            ggn-*.tar.gz
            dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
