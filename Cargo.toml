[package]
name = "vantablack"
version = "0.8.4"
edition = "2021"
description = "Post-quantum, cryptographically layered WAN mesh routing node."
homepage = "https://vantablack.kellersystems.dev/"
documentation = "https://vantablack.kellersystems.dev/docs"
repository = "https://github.com/KELLERBABG/Vantablack"

[[bin]]
name = "vantablack"
path = "src/main.rs"

[[bin]]
name = "ggn"
path = "src/main.rs"

[[bin]]
name = "scale_mesh"
path = "src/bin/scale_mesh.rs"

[[bin]]
name = "wan_mesh"
path = "src/bin/wan_mesh.rs"

[lib]
name = "vantablack"
crate-type = ["rlib", "cdylib"] # cdylib: Android JNI surface (cargo-ndk)

[features]
# The product IS a desktop application: a plain `cargo build` produces the
# native window (frameless tao + wry webview, tray icon). The HTTP control
# center still runs underneath, so the browser page keeps working as a
# secondary way in — and as the only way in for headless/server nodes built
# with `--no-default-features`.
default = ["webview"]
# Optional system-tray UI: `cargo build --features tray`.
tray = ["dep:tray-icon", "dep:tao"]
# Native frameless desktop window hosting the control center (implies `tray`).
# `cargo build --features webview`.
webview = ["tray", "dep:wry"]
# VPN (LAN-over-WAN): hub smoltcp netstack + client TUN transport.
vpn = ["dep:smoltcp"]
# Enable fuzz targets (fuzz/Cargo.toml)
fuzzing = []
# Hardware TPM 2.0 and PKCS#11 HSM integration stubs
hardware-tpm = []
pkcs11 = []
# QUIC as an optional transport under GTF: datagrams for the
# Reed-Solomon privacy path, streams for bulk frames. Self-signed certificates
# are accepted because the identity is bound to the TLS session by a channel
# binding instead — see `ghost::net::quic`.
quic = ["dep:quinn", "dep:rcgen"]
# Atmospheric Broadcast OS (ABOS) SDR ionospheric skywave carrier:
# Enables NVIS 2–10 MHz beyond-line-of-sight and meteor-burst physical fallback.
sdr = ["dep:abos"]
# TLS for the ETSI GS QKD 014 key-delivery client (`ghost::layers::l10_qel_etsi`).
# The standard mandates HTTPS with mutual certificate authentication, so a real
# QKD appliance cannot be reached without this. It is opt-in to keep the default
# binary free of a TLS stack — and a build without it *refuses* an https:// KME
# URL rather than falling back to plaintext key delivery.
qkd-tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:rustls-pemfile"]


# Embeds the application icon and version block into the Windows binaries
# (see build.rs and assets/app.rc). Harmless everywhere else: the build script
# returns early on non-Windows targets.
[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = 3         # Maximize execution throughput and enable auto-vectorization
lto = false           # Keep false on MSVC to avoid cdylib/bin symbol resolution conflict
codegen-units = 1     # Maximize optimization surface
strip = "symbols"     # Remove symbols from binary
panic = "abort"       # Skip unwind tables
debug = false         # No debug info

# A transport benchmark must not run under the profile above: it optimizes for the
# size of the shipped installer, which is both slow to build and a poor measure of
# how fast a carrier moves bytes. Build the bench with this profile instead (it
# keeps unwinding, because the bench is a test):
#
#   cargo test --profile bench-transport --features quic --test bench_transport -- --ignored
[profile.bench-transport]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
strip = "symbols"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.44", features = ["rt-multi-thread", "io-util", "net", "sync", "time", "macros", "process"] }
reed-solomon-erasure = "6.0.0"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# STUN MESSAGE-INTEGRITY (RFC 8489 §14.5) is HMAC-SHA1. Same RustCrypto family
# as the sha2/hkdf already used above; see `ghost::net::stun`.
hmac = "0.12"
sha1 = "0.10"
# TURN uses long-term credentials: MD5(username ":" realm ":" password) is the
# HMAC key (RFC 8489 §9.2.2). MD5 is required by the spec here, not chosen.
md5 = "0.7"
aes = "0.8"
xts-mode = "0.5"
gf256 = { version = "0.3", features = ["shamir", "thread-rng"] }
rand = "0.8.5"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
# The zero-knowledge membership proof on the discovery path is a Schnorr proof
# over Ristretto255, so the group arithmetic is needed directly and
# not only through ed25519-dalek. It is the same crate ed25519-dalek already
# pins, so this adds no second copy of curve25519 to the graph.
curve25519-dalek = "4.1.3"
ml-kem = { version = "0.3", features = ["getrandom"] }
# Post-quantum identity. The identity is hybrid — Ed25519 *and*
# ML-DSA-65 — because a node whose name can be forged cannot be trusted to hold a
# session, and Ed25519 is forgeable by Shor's algorithm on a cryptographically
# relevant quantum computer. Pure Rust (RustCrypto), `no_std` + `alloc`.
# `zeroize` makes the private key wipe itself on drop, and is a direct dependency
# here only so the identity layer's own seed buffers can be wiped too (it already
# arrives transitively via chacha20poly1305/ed25519-dalek).
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
subtle = "2.6"
hex = "0.4"
bytes = "1.9.0"
anyhow = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dashmap = "6.1.0"
socket2 = "0.5"
arc-swap = "1.7"
parking_lot = "0.12"
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"], optional = true }
tao = { version = "0.36.0", optional = true }
wry = { version = "0.56.0", optional = true }
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"], optional = true }
# QUIC transport (feature `quic`). `rustls-ring` supplies the crypto provider
# explicitly so the handshake does not depend on a process-wide default being
# installed first.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"], optional = true }
# Atmospheric Broadcast OS (ABOS) SDR ionospheric skywave carrier:
# Enables NVIS 2–10 MHz beyond-line-of-sight and meteor-burst physical fallback.
# The ABOS workspace is vendored in-repo (`abos/`) — Physical Anchor 1 — so the
# `sdr` build needs no network access. See docs/ANCHORS_CODEBASE_INTEGRATION.md.
abos = { path = "abos", optional = true }
# ETSI GS QKD 014 client (feature `qkd-tls`). `ring` is the provider, matching
# the QUIC transport's choice, so the build has one crypto backend rather than
# two; `tls12` keeps appliances that still cap out at TLS 1.2 reachable.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pemfile = { version = "2", optional = true }

[dev-dependencies]
# TLS test harness for the QKD 014 client: generates the self-signed appliance
# certificate the client then has to verify. Already in the dependency graph via
# the `quic` feature, so it adds no new crate to the lockfile.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

[package.metadata.deb]
name = "vantablack"
maintainer = "Keller Systems <security@kellersystems.dev>"
copyright = "2026 Keller Systems <security@kellersystems.dev>"
license-file = ["LICENSE", "4"]
extended-description = """
Vantablack is an autonomous peer-to-peer mesh routing daemon written in pure Rust.
Featuring hybrid ML-KEM-768 / X25519 cryptography, Reed-Solomon RS(2,1) multi-path sharding,
ShardSec per-shard authentication, SessionGuard anti-replay sliding window, and instant local SOCKS5 proxy.
"""
depends = "$auto, libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1"
section = "net"
priority = "optional"
assets = [
    ["target/release/ggn", "usr/bin/ggn", "755"],
    ["target/release/ggn", "usr/bin/vantablack", "755"],
    ["packaging/debian/vantablack.desktop", "usr/share/applications/vantablack.desktop", "644"],
    ["packaging/debian/vantablack.service", "lib/systemd/system/vantablack.service", "644"],
    ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/vantablack.svg", "644"],
    ["README.md", "usr/share/doc/vantablack/README.md", "644"],
]
