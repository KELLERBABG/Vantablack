[package]
name = "vantablack"
version = "0.7.6"
edition = "2021"
description = "Post-quantum, cryptographically layered WAN mesh routing node."

[[bin]]
name = "vantablack"
path = "src/main.rs"

[[bin]]
name = "ggn"
path = "src/main.rs"

[[bin]]
name = "scale_mesh"
path = "src/bin/scale_mesh.rs"

[[bin]]
name = "wan_mesh"
path = "src/bin/wan_mesh.rs"

[lib]
name = "vantablack"
crate-type = ["rlib", "cdylib"] # cdylib: Android JNI surface (cargo-ndk)

[features]
# The product IS a desktop application: a plain `cargo build` produces the
# native window (frameless tao + wry webview, tray icon). The HTTP control
# center still runs underneath, so the browser page keeps working as a
# secondary way in — and as the only way in for headless/server nodes built
# with `--no-default-features`.
default = ["webview"]
# Optional system-tray UI: `cargo build --features tray`.
tray = ["dep:tray-icon", "dep:tao"]
# Native frameless desktop window hosting the control center (implies `tray`).
# `cargo build --features webview`.
webview = ["tray", "dep:wry"]
# VPN (LAN-over-WAN): hub smoltcp netstack + client TUN transport.
vpn = ["dep:smoltcp"]
# Enable fuzz targets (fuzz/Cargo.toml)
fuzzing = []
# Hardware TPM 2.0 and PKCS#11 HSM integration stubs
hardware-tpm = []
pkcs11 = []
# QUIC as an optional transport under GTF: datagrams for the
# Reed-Solomon privacy path, streams for bulk frames. Self-signed certificates
# are accepted because the identity is bound to the TLS session by a channel
# binding instead — see `ghost::net::quic`.
quic = ["dep:quinn", "dep:rcgen"]

# Embeds the application icon and version block into the Windows binaries
# (see build.rs and assets/app.rc). Harmless everywhere else: the build script
# returns early on non-Windows targets.
[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = "z"     # Optimize for size
lto = "fat"         # Full link-time optimization
codegen-units = 1   # Maximize optimization surface
strip = "symbols"   # Remove symbols from binary
panic = "abort"     # Skip unwind tables
debug = false       # No debug info

# A transport benchmark must not run under the profile above: it optimizes for the
# size of the shipped installer, which is both slow to build and a poor measure of
# how fast a carrier moves bytes. Build the bench with this profile instead (it
# keeps unwinding, because the bench is a test):
#
#   cargo test --profile bench-transport --features quic --test bench_transport -- --ignored
[profile.bench-transport]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
strip = "symbols"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[dependencies]
tokio = { version = "1.44", features = ["rt-multi-thread", "io-util", "net", "sync", "time", "macros"] }
reed-solomon-erasure = "6.0.0"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# STUN MESSAGE-INTEGRITY (RFC 8489 §14.5) is HMAC-SHA1. Same RustCrypto family
# as the sha2/hkdf already used above; see `ghost::net::stun`.
hmac = "0.12"
sha1 = "0.10"
# TURN uses long-term credentials: MD5(username ":" realm ":" password) is the
# HMAC key (RFC 8489 §9.2.2). MD5 is required by the spec here, not chosen.
md5 = "0.7"
aes = "0.8"
xts-mode = "0.5"
gf256 = { version = "0.3", features = ["shamir", "thread-rng"] }
rand = "0.8.5"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
# The zero-knowledge membership proof on the discovery path is a Schnorr proof
# over Ristretto255, so the group arithmetic is needed directly and
# not only through ed25519-dalek. It is the same crate ed25519-dalek already
# pins, so this adds no second copy of curve25519 to the graph.
curve25519-dalek = "4.1.3"
ml-kem = { version = "0.3", features = ["getrandom"] }
# Post-quantum identity. The identity is hybrid — Ed25519 *and*
# ML-DSA-65 — because a node whose name can be forged cannot be trusted to hold a
# session, and Ed25519 is forgeable by Shor's algorithm on a cryptographically
# relevant quantum computer. Pure Rust (RustCrypto), `no_std` + `alloc`.
# `zeroize` makes the private key wipe itself on drop, and is a direct dependency
# here only so the identity layer's own seed buffers can be wiped too (it already
# arrives transitively via chacha20poly1305/ed25519-dalek).
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
subtle = "2.6"
hex = "0.4"
bytes = "1.9.0"
anyhow = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dashmap = "6.1.0"
socket2 = "0.5"
arc-swap = "1.7"
parking_lot = "0.12"
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"], optional = true }
tao = { version = "0.36.0", optional = true }
wry = { version = "0.56.0", optional = true }
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"], optional = true }
# QUIC transport (feature `quic`). `rustls-ring` supplies the crypto provider
# explicitly so the handshake does not depend on a process-wide default being
# installed first.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"], optional = true }
