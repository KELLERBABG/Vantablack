[package]
name = "vantablack"
version = "0.4.1"
edition = "2021"
description = "Post-quantum, cryptographically layered WAN mesh routing node."

[[bin]]
name = "vantablack"
path = "src/main.rs"

[lib]
name = "vantablack"
crate-type = ["rlib", "cdylib"] # cdylib: Android JNI surface (cargo-ndk)

[features]
default = []
# Optional system-tray UI: `cargo build --features tray`.
tray = ["dep:tray-icon", "dep:tao"]
# VPN (LAN-over-WAN): hub smoltcp netstack + client TUN transport.
vpn = ["dep:smoltcp", "dep:socket2"]
# Enable fuzz targets (fuzz/Cargo.toml)
fuzzing = []
# Hardware TPM 2.0 and PKCS#11 HSM integration stubs
hardware-tpm = []
pkcs11 = []

[profile.release]
opt-level = "z"     # Optimize for size
lto = "fat"         # Full link-time optimization
codegen-units = 1   # Maximize optimization surface
strip = "symbols"   # Remove symbols from binary
panic = "abort"     # Skip unwind tables
debug = false       # No debug info

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[dependencies]
tokio = { version = "1.44", features = ["rt-multi-thread", "io-util", "net", "sync", "time", "macros"] }
reed-solomon-erasure = "6.0.0"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
aes = "0.8"
xts-mode = "0.5"
gf256 = { version = "0.3", features = ["shamir", "thread-rng"] }
rand = "0.8.5"
x25519-dalek = "2.0.1"
ml-kem = { version = "0.3", features = ["getrandom"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
subtle = "2.6"
hex = "0.4"
bytes = "1.9.0"
anyhow = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dashmap = "6.1.0"
socket2 = { version = "0.5", optional = true }
arc-swap = "1.7"
parking_lot = "0.12"
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.24.2", optional = true }
tao = { version = "0.36.0", optional = true }
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"], optional = true }
